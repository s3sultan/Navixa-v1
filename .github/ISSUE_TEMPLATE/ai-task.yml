name: مهمة للذكاءات
description: إنشاء مهمة محكومة لغرفة التحكم متعددة الذكاءات
title: "[AI Task] "
body:
  - type: markdown
    attributes:
      value: |
        لا تبدأ أي منصة التنفيذ قبل اكتمال النطاق ومعايير القبول واعتماد المستخدم.
        لا تضع مفاتيح أو أسرارًا في هذه المهمة.

  - type: input
    id: objective
    attributes:
      label: الهدف
      description: ما النتيجة المطلوبة تحديدًا؟
      placeholder: نتيجة واحدة واضحة وقابلة للتحقق
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: معايير القبول
      description: اكتب شروط النجاح كقائمة قابلة للاختبار.
      placeholder: |
        - ينجح البناء
        - لا تتغير الملفات خارج النطاق
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: مستوى الخطورة
      options:
        - منخفض — تقرير أو تغيير محدود
        - متوسط — تعديل كود يحتاج مراجعة
        - مرتفع — صلاحيات أو خصوصية أو بيانات أو CI/CD
        - حرج — إنتاج أو أسرار أو حذف أو إجراء غير قابل للاسترجاع
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: الوكيل المقترح
      options:
        - Codex
        - Claude
        - Manus
        - Gemini AI Studio
        - غير محدد — يختاره المنسق
    validations:
      required: true

  - type: input
    id: base_commit
    attributes:
      label: Base commit
      description: commit الذي يجب أن يبدأ منه العمل، أو اكتب latest-master ليحسمه المنسق قبل التوزيع.
      placeholder: latest-master
    validations:
      required: true

  - type: textarea
    id: allowed_scope
    attributes:
      label: النطاق المسموح
      description: الملفات والخدمات والأدوات التي يسمح للوكيل بقراءتها أو تعديلها.
    validations:
      required: true

  - type: textarea
    id: forbidden_scope
    attributes:
      label: الممنوعات
      description: المسارات والإجراءات المحظورة، بما فيها النشر أو الأسرار إن لم تكن مطلوبة.
      placeholder: لا master، لا نشر، لا أسرار، لا ملفات خارج النطاق
    validations:
      required: true

  - type: input
    id: budget
    attributes:
      label: الميزانية والمهلة
      description: حد الوقت أو الاستخدام أو التكلفة، أو اكتب غير محدد.
      placeholder: 30 دقيقة، دون خدمات مدفوعة
    validations:
      required: true

  - type: checkboxes
    id: approval
    attributes:
      label: بوابة الاعتماد
      options:
        - label: أفهم أن إنشاء المهمة لا يجيز الدمج أو النشر، وأن التنفيذ ينتظر اعتماد المستخدم حسب مستوى الخطورة.
          required: true
