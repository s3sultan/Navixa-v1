name: Inspect auth secret history

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect recent Worker versions for auth binding names only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          versions=$(curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/navixa/versions?per_page=100" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          printf '%s' "$versions" > /tmp/versions.json
          node <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/versions.json', 'utf8'));
          if (!data.success) throw new Error('Could not list Worker versions');
          const versions = data.result || [];
          fs.writeFileSync('/tmp/version-ids.txt', versions.slice(0, 100).map(v => [v.id, v.number ?? '', v.metadata?.created_on ?? ''].join('\t')).join('\n'));
          console.log(`Found ${versions.length} recent versions; inspecting auth binding names only.`);
          NODE
          while IFS=$'\t' read -r id number created; do
            [ -n "$id" ] || continue
            detail=$(curl --fail-with-body --silent --show-error \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/navixa/versions/${id}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
            VERSION_ID="$id" VERSION_NUMBER="$number" VERSION_CREATED="$created" DETAIL="$detail" node <<'NODE'
            const data = JSON.parse(process.env.DETAIL || '{}');
            if (!data.success) process.exit(0);
            const r = data.result || {};
            const bindings = r.resources?.bindings || r.resources?.script?.bindings || [];
            const names = Array.isArray(bindings) ? bindings.map(b => ({name: b.name || '', type: b.type || ''})) : [];
            const auth = names.filter(b => /RESEND|NAVIXA_AUTH/i.test(b.name));
            if (auth.length) {
              console.log(JSON.stringify({
                versionId: process.env.VERSION_ID,
                number: process.env.VERSION_NUMBER,
                created: process.env.VERSION_CREATED,
                authBindings: auth
              }));
            }
            NODE
          done < /tmp/version-ids.txt
