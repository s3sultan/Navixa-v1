name: Inspect auth secret history

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect Worker version history for auth binding names only
        run: |
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !account) throw new Error('Cloudflare credentials unavailable');
          const base = `https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/navixa`;
          const headers = { Authorization: `Bearer ${token}` };
          async function json(url) {
            const r = await fetch(url, { headers });
            const body = await r.json();
            if (!r.ok || !body.success) throw new Error(`Cloudflare request failed: ${r.status}`);
            return body;
          }
          const versions = [];
          for (let page = 1; page <= 5; page++) {
            const body = await json(`${base}/versions?per_page=100&page=${page}`);
            const raw = body.result;
            const items = Array.isArray(raw) ? raw : (Array.isArray(raw?.items) ? raw.items : Array.isArray(raw?.versions) ? raw.versions : []);
            if (!items.length) break;
            versions.push(...items);
            if (items.length < 100) break;
          }
          console.log(`Inspecting ${versions.length} Worker versions; printing auth binding names only.`);
          let matches = 0;
          for (let i = 0; i < versions.length; i += 20) {
            const group = versions.slice(i, i + 20);
            const rows = await Promise.all(group.map(async v => {
              const body = await json(`${base}/versions/${v.id}`);
              const r = body.result || {};
              const bindings = Array.isArray(r.resources?.bindings) ? r.resources.bindings : [];
              const auth = bindings.map(b => ({ name: b.name || '', type: b.type || '' })).filter(b => /RESEND|NAVIXA_AUTH/i.test(b.name));
              return auth.length ? { versionId: v.id, number: v.number ?? '', created: v.metadata?.created_on ?? '', authBindings: auth } : null;
            }));
            for (const row of rows) if (row) { matches++; console.log(JSON.stringify(row)); }
          }
          console.log(`Historical auth-binding matches: ${matches}`);
          NODE
