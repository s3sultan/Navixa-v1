name: Reset NAVIXA Production Counters

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RESET_NAVIXA_COUNTERS to reset only the visible visit and Ehsan counters
        required: true
        type: string

permissions:
  contents: read

jobs:
  reset:
    if: inputs.confirm == 'RESET_NAVIXA_COUNTERS'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read official source
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Worker configuration
        run: npm run build

      - name: Reset visible counters only without deleting records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --no-install wrangler d1 execute navixa-db --remote --config dist/server/wrangler.json --command "UPDATE navixa_counters SET value=0, updated_at=CURRENT_TIMESTAMP WHERE key IN ('site_visits','ehsan_clicks');"

      - name: Verify reset counts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --no-install wrangler d1 execute navixa-db --remote --config dist/server/wrangler.json --command "SELECT key, value FROM navixa_counters WHERE key IN ('site_visits','ehsan_clicks');"
