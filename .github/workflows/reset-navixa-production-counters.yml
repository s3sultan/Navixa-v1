name: Reset NAVIXA Production Counters

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RESET_NAVIXA_COUNTERS to reset only the visible visit and Ehsan counters
        required: true
        type: string

permissions:
  contents: read

jobs:
  reset:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/master' && inputs.confirm == 'RESET_NAVIXA_COUNTERS'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read official source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Worker configuration
        run: npm run build

      - name: Reset visible counters only without deleting records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --no-install wrangler d1 execute navixa-db --remote --config dist/server/wrangler.json --command "UPDATE navixa_counters SET value=0, updated_at=CURRENT_TIMESTAMP WHERE key IN ('site_visits','ehsan_clicks');"

      - name: Verify reset counts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          result="$(npx --no-install wrangler d1 execute navixa-db --remote --config dist/server/wrangler.json --command "SELECT key, value FROM navixa_counters WHERE key IN ('site_visits','ehsan_clicks');")"
          printf '%s\n' "$result"
          printf '%s\n' "$result" | grep -q 'site_visits'
          printf '%s\n' "$result" | grep -q 'ehsan_clicks'
