name: NameSense Production Visual Check

on:
  push:
    branches:
      - ops/namesense-prod-visual-check-20260912

permissions:
  contents: read

jobs:
  visual-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify production HTTP and admin protection
        run: |
          set -euo pipefail
          curl --retry 4 --retry-all-errors --fail --silent --show-error --location \
            --output home.html https://navixasa.com/
          curl --retry 4 --retry-all-errors --fail --silent --show-error --location \
            --output study.html https://navixasa.com/namesense-study
          ADMIN_STATUS="$(curl --retry 4 --retry-all-errors --silent --show-error \
            --output admin-invites.json --write-out '%{http_code}' \
            https://navixasa.com/api/admin/namesense-benchmark/invites)"
          echo "Admin endpoint status: ${ADMIN_STATUS}"
          echo "Admin endpoint body:"
          cat admin-invites.json
          echo
          test -s home.html
          test -s study.html
          test "$ADMIN_STATUS" = "401"
          grep -q "غير مصرح" admin-invites.json

      - name: Capture production with Chrome
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          FAKE_TOKEN="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --window-size=1440,1100 --virtual-time-budget=7000 \
            --screenshot=home.png https://navixasa.com/
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --window-size=1440,1100 --virtual-time-budget=7000 \
            --screenshot=namesense-study.png https://navixasa.com/namesense-study
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --virtual-time-budget=7000 --dump-dom https://navixasa.com/namesense-study > namesense-study-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --window-size=1440,1100 --virtual-time-budget=9000 \
            --screenshot=namesense-fake-invite.png "https://navixasa.com/namesense-study#invite=${FAKE_TOKEN}"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --virtual-time-budget=9000 --dump-dom "https://navixasa.com/namesense-study#invite=${FAKE_TOKEN}" > namesense-fake-invite-dom.html
          test -s home.png
          test -s namesense-study.png
          test -s namesense-fake-invite.png
          grep -q "NameSense\|مشاركة\|دعوة\|رابط" namesense-study-dom.html
          grep -q "غير صالح\|انتهت صلاحيته\|تعذر فتح المشاركة" namesense-fake-invite-dom.html
          if grep -q "${FAKE_TOKEN}" namesense-fake-invite-dom.html; then
            echo "Fake token leaked into rendered DOM" >&2
            exit 1
          fi

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: namesense-production-visual-evidence
          path: |
            home.png
            namesense-study.png
            namesense-study-dom.html
            namesense-fake-invite.png
            namesense-fake-invite-dom.html
            admin-invites.json
            home.html
            study.html
          if-no-files-found: error
          retention-days: 1
