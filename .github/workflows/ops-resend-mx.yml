name: Ops Activate NAVIXA Payments Email

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/ops-resend-mx.yml

permissions:
  contents: read

jobs:
  activate-payments-email:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ensure payments address routes through Cloudflare Email Routing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_DNS: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
          TOKEN_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL_API_TOKEN }}
          TOKEN_EMAIL_ROUTING: ${{ secrets.CLOUDFLARE_EMAIL_ROUTING_API_TOKEN }}
          TOKEN_CF: ${{ secrets.CF_API_TOKEN }}
          GLOBAL_KEY_1: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          GLOBAL_KEY_2: ${{ secrets.CLOUDFLARE_API_KEY }}
          GLOBAL_KEY_3: ${{ secrets.CF_API_KEY }}
          GLOBAL_EMAIL_1: ${{ secrets.CLOUDFLARE_EMAIL }}
          GLOBAL_EMAIL_2: ${{ secrets.CF_API_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Cloudflare account ID is missing"; exit 1; }
          test -n "$TOKEN_PRIMARY" || { echo "Primary Cloudflare token is missing"; exit 1; }

          api='https://api.cloudflare.com/client/v4'
          primary_auth=(-H "Authorization: Bearer ${TOKEN_PRIMARY}" -H 'Content-Type: application/json')
          zone_json=$(curl --fail --silent --show-error "${primary_auth[@]}" "$api/zones?name=navixasa.com")
          zone_id=$(printf '%s' "$zone_json" | jq -r '.result[0].id // empty')
          test -n "$zone_id" || { echo "Cloudflare zone is unavailable"; exit 1; }
          echo "Cloudflare zone access: OK"

          selected_mode=''
          selected_credential=''
          selected_email=''

          try_bearer() {
            local candidate="$1"
            [ -n "$candidate" ] || return 1
            local code_a code_r
            code_a=$(curl --silent --show-error -o /tmp/cf_addr.json -w '%{http_code}' -H "Authorization: Bearer ${candidate}" -H 'Content-Type: application/json' "$api/accounts/${CLOUDFLARE_ACCOUNT_ID}/email/routing/addresses?per_page=100" || true)
            code_r=$(curl --silent --show-error -o /tmp/cf_rules.json -w '%{http_code}' -H "Authorization: Bearer ${candidate}" -H 'Content-Type: application/json' "$api/zones/${zone_id}/email/routing/rules?per_page=100" || true)
            [ "$code_a" = '200' ] && [ "$code_r" = '200' ] && jq -e '.success == true' /tmp/cf_addr.json >/dev/null && jq -e '.success == true' /tmp/cf_rules.json >/dev/null
          }

          for candidate in "$TOKEN_PRIMARY" "$TOKEN_DNS" "$TOKEN_EMAIL" "$TOKEN_EMAIL_ROUTING" "$TOKEN_CF"; do
            if try_bearer "$candidate"; then
              selected_mode='bearer'
              selected_credential="$candidate"
              break
            fi
          done

          if [ -z "$selected_mode" ]; then
            for key in "$GLOBAL_KEY_1" "$GLOBAL_KEY_2" "$GLOBAL_KEY_3"; do
              [ -n "$key" ] || continue
              for email in "$GLOBAL_EMAIL_1" "$GLOBAL_EMAIL_2"; do
                [ -n "$email" ] || continue
                code_a=$(curl --silent --show-error -o /tmp/cf_addr.json -w '%{http_code}' -H "X-Auth-Key: ${key}" -H "X-Auth-Email: ${email}" -H 'Content-Type: application/json' "$api/accounts/${CLOUDFLARE_ACCOUNT_ID}/email/routing/addresses?per_page=100" || true)
                code_r=$(curl --silent --show-error -o /tmp/cf_rules.json -w '%{http_code}' -H "X-Auth-Key: ${key}" -H "X-Auth-Email: ${email}" -H 'Content-Type: application/json' "$api/zones/${zone_id}/email/routing/rules?per_page=100" || true)
                if [ "$code_a" = '200' ] && [ "$code_r" = '200' ] && jq -e '.success == true' /tmp/cf_addr.json >/dev/null && jq -e '.success == true' /tmp/cf_rules.json >/dev/null; then
                  selected_mode='global'
                  selected_credential="$key"
                  selected_email="$email"
                  break 2
                fi
              done
            done
          fi

          if [ -z "$selected_mode" ]; then
            echo "No existing Cloudflare credential has Email Routing access."
            exit 5
          fi
          echo "Cloudflare Email Routing credential: available"

          cf_get() {
            local url="$1"
            if [ "$selected_mode" = 'bearer' ]; then
              curl --fail --silent --show-error -H "Authorization: Bearer ${selected_credential}" -H 'Content-Type: application/json' "$url"
            else
              curl --fail --silent --show-error -H "X-Auth-Key: ${selected_credential}" -H "X-Auth-Email: ${selected_email}" -H 'Content-Type: application/json' "$url"
            fi
          }

          cf_write() {
            local method="$1" url="$2" payload="$3"
            if [ "$selected_mode" = 'bearer' ]; then
              curl --fail --silent --show-error --request "$method" -H "Authorization: Bearer ${selected_credential}" -H 'Content-Type: application/json' --data "$payload" "$url"
            else
              curl --fail --silent --show-error --request "$method" -H "X-Auth-Key: ${selected_credential}" -H "X-Auth-Email: ${selected_email}" -H 'Content-Type: application/json' --data "$payload" "$url"
            fi
          }

          addresses_json=$(cf_get "$api/accounts/${CLOUDFLARE_ACCOUNT_ID}/email/routing/addresses?per_page=100")
          rules_json=$(cf_get "$api/zones/${zone_id}/email/routing/rules?per_page=100")
          verified_count=$(printf '%s' "$addresses_json" | jq '[.result[] | select(.verified != null)] | length')
          payment_rules=$(printf '%s' "$rules_json" | jq '[.result[] | select(any(.matchers[]?; .type == "literal" and .field == "to" and .value == "payments@navixasa.com"))] | length')
          echo "Verified Email Routing destinations: ${verified_count}"
          echo "Existing payments routing rules: ${payment_rules}"

          if [ "$payment_rules" -gt 1 ]; then
            echo "Multiple payments routing rules exist; refusing an ambiguous change."
            exit 2
          fi

          if [ "$payment_rules" -eq 1 ]; then
            rule=$(printf '%s' "$rules_json" | jq -c '.result[] | select(any(.matchers[]?; .type == "literal" and .field == "to" and .value == "payments@navixasa.com"))')
            enabled=$(printf '%s' "$rule" | jq -r '.enabled')
            action=$(printf '%s' "$rule" | jq -r '.actions[0].type // empty')
            if [ "$action" != "forward" ]; then
              echo "payments routing exists but is not a forward rule; refusing to overwrite it."
              exit 3
            fi
            if [ "$enabled" = 'true' ]; then
              echo "payments@navixasa.com routing is already active."
              exit 0
            fi
            rule_id=$(printf '%s' "$rule" | jq -r '.id')
            payload=$(printf '%s' "$rule" | jq '{actions,matchers,name,priority,enabled:true}')
            update_json=$(cf_write PUT "$api/zones/${zone_id}/email/routing/rules/${rule_id}" "$payload")
            printf '%s' "$update_json" | jq -e '.success == true and .result.enabled == true' >/dev/null
            echo "Existing payments routing rule activated."
            exit 0
          fi

          if [ "$verified_count" -ne 1 ]; then
            echo "Cannot safely choose a forwarding destination automatically."
            exit 4
          fi

          destination=$(printf '%s' "$addresses_json" | jq -r '.result[] | select(.verified != null) | .email')
          test -n "$destination"
          payload=$(jq -nc --arg destination "$destination" '{actions:[{type:"forward",value:[$destination]}],matchers:[{type:"literal",field:"to",value:"payments@navixasa.com"}],enabled:true,name:"NAVIXA payments inbox",priority:0}')
          create_json=$(cf_write POST "$api/zones/${zone_id}/email/routing/rules" "$payload")
          printf '%s' "$create_json" | jq -e '.success == true and .result.enabled == true' >/dev/null
          echo "payments@navixasa.com routing rule created and activated."
