name: Ops Configure NAVIXA Mail DNS

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/ops-resend-mx.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure-mail-dns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ensure Resend inbound MX on navixasa.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }

          desired_name="navixasa.com"
          desired_content="inbound-smtp.ap-northeast-1.amazonaws.com"
          desired_priority=10

          zone_json=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones?name=${desired_name}")
          printf '%s' "$zone_json" | jq -e '.success == true' >/dev/null
          zone_id=$(printf '%s' "$zone_json" | jq -r '.result[0].id // empty')
          test -n "$zone_id" || { echo "Zone navixasa.com was not found or token cannot access it"; exit 1; }
          echo "Cloudflare zone is accessible."

          mx_json=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?type=MX&name=${desired_name}&per_page=100")
          printf '%s' "$mx_json" | jq -e '.success == true' >/dev/null
          count=$(printf '%s' "$mx_json" | jq '.result | length')
          echo "Current root MX record count: ${count}"

          if [ "$count" -eq 0 ]; then
            echo "No root MX exists. Creating the Resend inbound MX."
            payload=$(jq -nc \
              --arg name "$desired_name" \
              --arg content "$desired_content" \
              --argjson priority "$desired_priority" \
              '{type:"MX",name:$name,content:$content,priority:$priority,ttl:1}')
            create_json=$(curl --fail-with-body --silent --show-error \
              --request POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records")
            printf '%s' "$create_json" | jq -e '.success == true' >/dev/null
            echo "Resend inbound MX created."
          else
            exact_matches=$(printf '%s' "$mx_json" | jq --arg content "$desired_content" --argjson priority "$desired_priority" '[.result[] | select(.content == $content and .priority == $priority)] | length')
            if [ "$count" -eq 1 ] && [ "$exact_matches" -eq 1 ]; then
              echo "Resend inbound MX already configured correctly."
            else
              echo "Conflicting root MX records detected. No DNS records were changed."
              printf '%s' "$mx_json" | jq -r '.result[] | "MX name=\(.name) content=\(.content) priority=\(.priority) ttl=\(.ttl)"'
              exit 2
            fi
          fi

          verify_json=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?type=MX&name=${desired_name}&per_page=100")
          printf '%s' "$verify_json" | jq -e --arg content "$desired_content" --argjson priority "$desired_priority" '.success == true and ([.result[] | select(.content == $content and .priority == $priority)] | length) == 1' >/dev/null
          echo "Cloudflare MX verification passed."
