name: Background reminders phase 1 codemod v3

on:
  push:
    branches:
      - feat/background-reminders-phase1
    paths:
      - .github/workflows/background-reminders-phase1-codemod-v3.yml

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/background-reminders-phase1
      - name: Apply product codemod from reviewed script
        shell: python
        run: |
          from pathlib import Path
          source=Path('.github/workflows/background-reminders-phase1-codemod-v2.yml').read_text(encoding='utf-8')
          marker='      - name: Implement workflow queue reminder pipeline'
          start=source.index('        run: |\n',source.index(marker))+len('        run: |\n')
          end=source.index('      - name:',start)
          lines=[]
          for line in source[start:end].splitlines():
            lines.append(line[10:] if line.startswith('          ') else line)
          exec(compile('\n'.join(lines),'background-reminders-codemod','exec'),{})

          # Production bindings come from the Vite/Cloudflare config. Keep the
          # deployment workflow itself unchanged so its existing release gates stay intact.
          import subprocess
          subprocess.run(['git','checkout','--','.github/workflows/deploy-navixa-auto.yml'],check=True)

          vite=Path('vite.config.ts')
          text=vite.read_text(encoding='utf-8')
          old='  triggers: { crons: ["0 3 * * *"] },\n  d1_databases: ['
          new='''  triggers: { crons: ["0 3 * * *"] },\n  workflows: [\n    { name: "navixa-academic-reminders", binding: "ACADEMIC_REMINDER_WORKFLOW", class_name: "AcademicReminderWorkflow" },\n  ],\n  queues: {\n    producers: [{ binding: "ACADEMIC_ALERT_QUEUE", queue: "navixa-academic-alerts" }],\n    consumers: [{ queue: "navixa-academic-alerts", max_batch_size: 1, max_batch_timeout: 1, max_retries: 3, dead_letter_queue: "navixa-academic-alerts-dlq" }],\n  },\n  d1_databases: ['''
          if old not in text: raise SystemExit('vite binding anchor missing')
          vite.write_text(text.replace(old,new,1),encoding='utf-8')

          test=Path('tests/important-reminders.test.ts')
          text=test.read_text(encoding='utf-8')
          text=text.replace(', deploy] = await Promise.all([',', vite] = await Promise.all([',1)
          text=text.replace('readFile(new URL("../.github/workflows/deploy-navixa-auto.yml", import.meta.url), "utf8")','readFile(new URL("../vite.config.ts", import.meta.url), "utf8")',1)
          text=text.replace('assert.match(deploy, /ACADEMIC_REMINDER_WORKFLOW/);','assert.match(vite, /ACADEMIC_REMINDER_WORKFLOW/);',1)
          text=text.replace('assert.match(deploy, /navixa-academic-alerts/);','assert.match(vite, /navixa-academic-alerts/);',1)
          text=text.replace('assert.match(deploy, /navixa-academic-alerts-dlq/);','assert.match(vite, /navixa-academic-alerts-dlq/);',1)
          text=text.replace('assert.match(deploy, /wrangler queues create navixa-academic-alerts/);','assert.match(vite, /dead_letter_queue: "navixa-academic-alerts-dlq"/);',1)
          test.write_text(text,encoding='utf-8')
      - name: Verify product diff
        run: |
          test -f worker/backgroundAcademic.ts
          grep -F 'AcademicReminderWorkflow' worker/index.ts
          ! grep -F 'deliverDueMatchPushes' worker/index.ts
          grep -F 'ACADEMIC_REMINDER_WORKFLOW' vite.config.ts
          grep -F 'navixa-academic-alerts-dlq' vite.config.ts
      - name: Commit product implementation
        run: |
          git config user.name 'NAVIXA automation'
          git config user.email 'actions@users.noreply.github.com'
          git add worker/backgroundAcademic.ts worker/index.ts vite.config.ts tests/important-reminders.test.ts
          git commit -m 'feat: route reminders through workflow and queue'
          git push origin HEAD:feat/background-reminders-phase1
