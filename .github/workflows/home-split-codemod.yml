name: NAVIXA Home Split Codemod

on:
  push:
    branches: [perf/home-split-phase1]
    paths:
      - '.github/workflows/home-split-codemod.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated performance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/home-split-phase1

      - name: Split on-demand homepage video UI
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='app/page.tsx';
          let source=fs.readFileSync(path,'utf8');
          const importAnchor='const MemberPlatformRibbon = dynamic(() => import("./MemberPlatformRibbon"), { ssr: false });';
          const dynamicImport='const HomeVideoModal = dynamic(() => import("./home-performance/HomeVideoModal"), { ssr: false });';
          if(!source.includes(importAnchor)) throw new Error('MemberPlatformRibbon import anchor not found');
          if(!source.includes(dynamicImport)) source=source.replace(importAnchor,`${importAnchor}\n${dynamicImport}`);
          const lines=source.split('\n');
          const overviewIndex=lines.findIndex(line=>line.includes('{overviewVideoOpen&&<div className="navixa-overview-video-backdrop"'));
          const tutorialIndex=lines.findIndex(line=>line.includes('{tutorialOpen&&<div className="tutorial-modal-back"'));
          if(overviewIndex<0) throw new Error('overview video modal anchor not found');
          if(tutorialIndex<0) throw new Error('tutorial video modal anchor not found');
          lines[overviewIndex]='    {(overviewVideoOpen||tutorialOpen)&&<HomeVideoModal tutorialOpen={tutorialOpen} overviewVideoOpen={overviewVideoOpen} onCloseTutorial={()=>setTutorialOpen(null)} onHideTutorial={hideTutorial} onCloseOverview={()=>setOverviewVideoOpen(false)}/>}'
          lines[tutorialIndex]='';
          source=lines.join('\n');
          if(source.includes('navixa-overview-video-backdrop')) throw new Error('overview modal remained inline');
          if(source.includes('{tutorialOpen&&<div className="tutorial-modal-back"')) throw new Error('tutorial modal remained inline');
          if(!source.includes('<HomeVideoModal')) throw new Error('split component was not mounted');
          fs.writeFileSync(path,source);
          NODE

      - name: Commit isolated source split
        shell: bash
        run: |
          git config user.name "navixa-performance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --check
          git commit -m "perf(home): lazy-load video modals"
          git push origin HEAD:perf/home-split-phase1
