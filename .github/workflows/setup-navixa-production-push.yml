name: Setup NAVIXA Production Push

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type SETUP_NAVIXA_PUSH to configure Push only when it is currently disabled
        required: true
        type: string

permissions:
  contents: read

jobs:
  setup-push:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/master' && inputs.confirm == 'SETUP_NAVIXA_PUSH'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read official source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Skip when Push is already active
        id: status
        run: |
          response="$(curl --fail --silent --show-error https://navixa.s2shug.workers.dev/api/push/config || true)"
          if printf '%s' "$response" | grep -q '"enabled":true'; then
            echo "already_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Worker configuration
        if: steps.status.outputs.already_enabled != 'true'
        run: npm run build

      - name: Generate and save production VAPID secrets
        if: steps.status.outputs.already_enabled != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          keys="$(npx --no-install web-push generate-vapid-keys)"
          public_key="$(printf '%s\n' "$keys" | awk '/^Public Key:/{getline; print; exit}')"
          private_key="$(printf '%s\n' "$keys" | awk '/^Private Key:/{getline; print; exit}')"
          test -n "$public_key"
          test -n "$private_key"
          printf '%s' "$public_key" | npx --no-install wrangler secret put VAPID_PUBLIC_KEY --config dist/server/wrangler.json --name navixa
          printf '%s' "$private_key" | npx --no-install wrangler secret put VAPID_PRIVATE_KEY --config dist/server/wrangler.json --name navixa
          printf '%s' 'https://navixasa.com' | npx --no-install wrangler secret put VAPID_SUBJECT --config dist/server/wrangler.json --name navixa

      - name: Verify Push activation without exposing secrets
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            response="$(curl --fail --silent --show-error https://navixa.s2shug.workers.dev/api/push/config || true)"
            if printf '%s' "$response" | grep -q '"enabled":true'; then
              echo "Push is active."
              exit 0
            fi
            sleep 5
          done
          echo "Push configuration did not activate."
          exit 1
