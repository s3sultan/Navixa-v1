name: Fix background codemod verification

on:
  push:
    branches:
      - feat/background-reminders-phase1
    paths:
      - .github/workflows/fix-background-codemod-v2.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/background-reminders-phase1
      - name: Fix literal secret reference check
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/background-reminders-phase1-codemod-v2.yml')
          text=p.read_text(encoding='utf-8')
          start=text.index('      - name: Verify no secret values were materialized')
          end=text.index('      - name: Commit implementation',start)
          block='''      - name: Verify references and paused match scheduler\n        shell: python\n        run: |\n          from pathlib import Path\n          deploy=Path('.github/workflows/deploy-navixa-auto.yml').read_text(encoding='utf-8')\n          token='$'+'{{ secrets.CLOUDFLARE_API_TOKEN }}'\n          account='$'+'{{ secrets.CLOUDFLARE_ACCOUNT_ID }}'\n          assert token in deploy\n          assert account in deploy\n          assert 'deliverDueMatchPushes' not in Path('worker/index.ts').read_text(encoding='utf-8')\n'''
          p.write_text(text[:start]+block+text[end:],encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name 'NAVIXA automation'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/background-reminders-phase1-codemod-v2.yml
          git commit -m 'chore: fix codemod secret reference check'
          git push origin HEAD:feat/background-reminders-phase1
