name: Background reminders phase 1 codemod v2

on:
  push:
    branches:
      - feat/background-reminders-phase1
    paths:
      - .github/workflows/background-reminders-phase1-codemod-v2.yml

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/background-reminders-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Implement workflow queue reminder pipeline
        shell: python
        run: |
          from pathlib import Path

          background = Path('worker/backgroundAcademic.ts')
          background.write_text('''import { WorkflowEntrypoint, WorkflowStep } from "cloudflare:workers";\nimport type { WorkflowEvent } from "cloudflare:workers";\nimport { deliverDueImportantReminders } from "./importantReminders";\n\ntype DbStatement={bind:(...values:unknown[])=>DbStatement;all:<T=Record<string,unknown>>()=>Promise<{results:T[]}>;run:()=>Promise<unknown>};\ntype Db={prepare:(sql:string)=>DbStatement};\ntype AcademicSweepParams={sweepId:string;scheduledAt:string};\ntype AcademicQueuePayload={kind:"deliver_due_reminders";sweepId:string;scheduledAt:string};\ntype WorkflowBinding={create:(options:{id:string;params:AcademicSweepParams})=>Promise<{id:string}>};\ntype QueueProducer={send:(message:AcademicQueuePayload)=>Promise<void>};\nexport type AcademicQueueMessage={body:unknown;attempts:number;ack:()=>void;retry:(options?:{delaySeconds?:number})=>void};\nexport type AcademicQueueBatch={messages:AcademicQueueMessage[]};\nexport type AcademicBackgroundEnv={\n  DB:Db;\n  RESEND_API_KEY?:string;\n  RESEND_FROM_EMAIL?:string;\n  NAVIXA_AUTH_FROM?:string;\n  NAVIXA_TELEGRAM_BOT_TOKEN?:string;\n  NAVIXA_TELEGRAM_ENCRYPTION_KEY?:string;\n  ACADEMIC_REMINDER_WORKFLOW?:WorkflowBinding;\n  ACADEMIC_ALERT_QUEUE?:QueueProducer;\n};\n\nconst minuteSweep=(scheduledTime?:number)=>{\n  const candidate=typeof scheduledTime==="number"&&Number.isFinite(scheduledTime)?scheduledTime:Date.now();\n  const date=new Date(candidate);\n  date.setUTCSeconds(0,0);\n  const scheduledAt=date.toISOString();\n  return {scheduledAt,sweepId:`academic-${scheduledAt.replace(/[-:.TZ]/g,"")}`};\n};\n\nconst isDuplicateWorkflowError=(error:unknown)=>{\n  const message=error instanceof Error?error.message:String(error??"");\n  return /already|exists|duplicate|unique/i.test(message);\n};\n\nexport async function triggerAcademicReminderWorkflow(env:AcademicBackgroundEnv,scheduledTime?:number){\n  const sweep=minuteSweep(scheduledTime);\n  if(!env.ACADEMIC_REMINDER_WORKFLOW){\n    const fallback=await deliverDueImportantReminders(env);\n    return {mode:"fallback" as const,...sweep,...fallback};\n  }\n  try{\n    await env.ACADEMIC_REMINDER_WORKFLOW.create({id:sweep.sweepId,params:sweep});\n    return {mode:"workflow" as const,...sweep};\n  }catch(error){\n    if(isDuplicateWorkflowError(error))return {mode:"deduped" as const,...sweep};\n    const fallback=await deliverDueImportantReminders(env);\n    return {mode:"fallback" as const,...sweep,...fallback};\n  }\n}\n\nexport class AcademicReminderWorkflow extends WorkflowEntrypoint<AcademicBackgroundEnv,AcademicSweepParams>{\n  async run(event:WorkflowEvent<AcademicSweepParams>,step:WorkflowStep){\n    return step.do("queue due reminder delivery",async()=>{\n      if(!this.env.ACADEMIC_ALERT_QUEUE)throw new Error("ACADEMIC_ALERT_QUEUE binding missing");\n      const message:AcademicQueuePayload={kind:"deliver_due_reminders",sweepId:event.payload.sweepId,scheduledAt:event.payload.scheduledAt};\n      await this.env.ACADEMIC_ALERT_QUEUE.send(message);\n      return {queued:true,sweepId:event.payload.sweepId};\n    });\n  }\n}\n\nconst validPayload=(value:unknown):value is AcademicQueuePayload=>{\n  if(!value||typeof value!=="object")return false;\n  const body=value as Partial<AcademicQueuePayload>;\n  return body.kind==="deliver_due_reminders"&&typeof body.sweepId==="string"&&body.sweepId.startsWith("academic-")&&typeof body.scheduledAt==="string"&&Number.isFinite(Date.parse(body.scheduledAt));\n};\n\nexport async function consumeAcademicReminderQueue(batch:AcademicQueueBatch,env:AcademicBackgroundEnv){\n  let processed=0,delivered=0,retried=0,invalid=0;\n  for(const message of batch.messages){\n    if(!validPayload(message.body)){message.ack();invalid+=1;continue}\n    try{\n      const result=await deliverDueImportantReminders(env);\n      message.ack();\n      processed+=1;\n      delivered+=result.delivered;\n    }catch{\n      const delaySeconds=Math.min(900,30*(2**Math.max(0,message.attempts-1)));\n      message.retry({delaySeconds});\n      retried+=1;\n    }\n  }\n  return {processed,delivered,retried,invalid};\n}\n''',encoding='utf-8')

          index = Path('worker/index.ts')
          text = index.read_text(encoding='utf-8')
          text = text.replace('import { deliverDueMatchPushes } from "./matchPush";\n','',1)
          old='import { deliverDueImportantReminders } from "./importantReminders";\n'
          if old not in text: raise SystemExit('important reminder import anchor missing')
          text=text.replace(old,'import { consumeAcademicReminderQueue, triggerAcademicReminderWorkflow, type AcademicQueueBatch } from "./backgroundAcademic";\nexport { AcademicReminderWorkflow } from "./backgroundAcademic";\n',1)
          old='  async scheduled(_controller: { cron: string }, env: Env, ctx: ExecutionContext) {\n    ctx.waitUntil(deliverDueMatchPushes(env).then(result => console.log(JSON.stringify({ event: "match_push_scheduled", delivered: result.delivered, skipped: result.skipped }))));\n'
          new='  async scheduled(controller: { cron: string; scheduledTime?: number }, env: Env, ctx: ExecutionContext) {\n    ctx.waitUntil(triggerAcademicReminderWorkflow(env,controller.scheduledTime).then(result => console.log(JSON.stringify({ event: "academic_reminder_workflow", ...result }))).catch(error => console.log(JSON.stringify({ event: "academic_reminder_workflow_failed", message: error instanceof Error ? error.message : "unknown" }))));\n'
          if old not in text: raise SystemExit('scheduled handler anchor missing')
          text=text.replace(old,new,1)
          old='    ctx.waitUntil(deliverDueImportantReminders(env).then(result => console.log(JSON.stringify({ event: "important_reminders", ...result }))).catch(error => console.log(JSON.stringify({ event: "important_reminders_failed", message: error instanceof Error ? error.message : "unknown" }))));\n'
          if old not in text: raise SystemExit('direct reminder anchor missing')
          text=text.replace(old,'',1)
          anchor='  async fetch(request: Request, env: Env, ctx: ExecutionContext): Promise<Response> {\n'
          queue='  async queue(batch: AcademicQueueBatch, env: Env): Promise<void> {\n    const result=await consumeAcademicReminderQueue(batch,env);\n    console.log(JSON.stringify({event:"academic_reminder_queue",...result}));\n  },\n'
          if anchor not in text: raise SystemExit('fetch anchor missing')
          text=text.replace(anchor,queue+anchor,1)
          index.write_text(text,encoding='utf-8')

          deploy=Path('.github/workflows/deploy-navixa-auto.yml')
          text=deploy.read_text(encoding='utf-8')
          old="          config.triggers = { ...(config.triggers || {}), crons: ['* * * * *'] };\n          config.keep_vars = true;"
          new="""          config.triggers = { ...(config.triggers || {}), crons: ['* * * * *'] };\n          config.workflows = [\n            ...(config.workflows || []).filter((item) => item.binding !== 'ACADEMIC_REMINDER_WORKFLOW'),\n            { name: 'navixa-academic-reminders', binding: 'ACADEMIC_REMINDER_WORKFLOW', class_name: 'AcademicReminderWorkflow' },\n          ];\n          config.queues = config.queues || {};\n          config.queues.producers = [\n            ...(config.queues.producers || []).filter((item) => item.binding !== 'ACADEMIC_ALERT_QUEUE'),\n            { queue: 'navixa-academic-alerts', binding: 'ACADEMIC_ALERT_QUEUE' },\n          ];\n          config.queues.consumers = [\n            ...(config.queues.consumers || []).filter((item) => item.queue !== 'navixa-academic-alerts'),\n            { queue: 'navixa-academic-alerts', max_batch_size: 1, max_batch_timeout: 1, max_retries: 3, dead_letter_queue: 'navixa-academic-alerts-dlq' },\n          ];\n          config.keep_vars = true;"""
          if old not in text: raise SystemExit('deploy config anchor missing')
          text=text.replace(old,new,1)
          anchor='      - name: Deploy NAVIXA Worker preserving remote secrets and bindings\n'
          token_expr='$'+'{{ secrets.CLOUDFLARE_API_TOKEN }}'
          account_expr='$'+'{{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
          ensure=f'''      - name: Ensure background reminder queues\n        env:\n          CLOUDFLARE_API_TOKEN: {token_expr}\n          CLOUDFLARE_ACCOUNT_ID: {account_expr}\n        run: |\n          set -euo pipefail\n          npx --no-install wrangler queues info navixa-academic-alerts >/dev/null 2>&1 || npx --no-install wrangler queues create navixa-academic-alerts\n          npx --no-install wrangler queues info navixa-academic-alerts-dlq >/dev/null 2>&1 || npx --no-install wrangler queues create navixa-academic-alerts-dlq\n\n'''
          if anchor not in text: raise SystemExit('deploy anchor missing')
          text=text.replace(anchor,ensure+anchor,1)
          deploy.write_text(text,encoding='utf-8')

          test=Path('tests/important-reminders.test.ts')
          text=test.read_text(encoding='utf-8')
          old='const [worker, route, index, academic, preferences, controls, today] = await Promise.all([\n'
          new='const [worker, background, route, index, academic, preferences, controls, today, deploy] = await Promise.all([\n'
          if old not in text: raise SystemExit('test tuple anchor missing')
          text=text.replace(old,new,1)
          old='  readFile(new URL("../worker/importantReminders.ts", import.meta.url), "utf8"),\n'
          text=text.replace(old,old+'  readFile(new URL("../worker/backgroundAcademic.ts", import.meta.url), "utf8"),\n',1)
          old='  readFile(new URL("../app/today/page.tsx", import.meta.url), "utf8"),\n]);\n'
          new='  readFile(new URL("../app/today/page.tsx", import.meta.url), "utf8"),\n  readFile(new URL("../.github/workflows/deploy-navixa-auto.yml", import.meta.url), "utf8"),\n]);\n'
          if old not in text: raise SystemExit('test deploy anchor missing')
          text=text.replace(old,new,1)
          old='assert.match(index, /deliverDueImportantReminders/);\n'
          new='''assert.match(background, /WorkflowEntrypoint/);\nassert.match(background, /ACADEMIC_ALERT_QUEUE/);\nassert.match(background, /deliverDueImportantReminders/);\nassert.match(background, /message\\.retry\\(\\{delaySeconds\\}\\)/);\nassert.match(index, /triggerAcademicReminderWorkflow/);\nassert.match(index, /consumeAcademicReminderQueue/);\nassert.doesNotMatch(index, /deliverDueMatchPushes/);\nassert.doesNotMatch(index, /ctx\\.waitUntil\\(deliverDueImportantReminders/);\nassert.match(deploy, /ACADEMIC_REMINDER_WORKFLOW/);\nassert.match(deploy, /navixa-academic-alerts/);\nassert.match(deploy, /navixa-academic-alerts-dlq/);\nassert.match(deploy, /wrangler queues create navixa-academic-alerts/);\n'''
          if old not in text: raise SystemExit('test assertion anchor missing')
          text=text.replace(old,new,1)
          test.write_text(text,encoding='utf-8')
      - name: Verify no secret values were materialized
        run: |
          grep -F '${{ secrets.CLOUDFLARE_API_TOKEN }}' .github/workflows/deploy-navixa-auto.yml
          grep -F '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' .github/workflows/deploy-navixa-auto.yml
          ! grep -F 'deliverDueMatchPushes' worker/index.ts
      - name: Commit implementation
        run: |
          git config user.name 'NAVIXA automation'
          git config user.email 'actions@users.noreply.github.com'
          git add worker/backgroundAcademic.ts worker/index.ts .github/workflows/deploy-navixa-auto.yml tests/important-reminders.test.ts
          git commit -m 'feat: route reminders through workflow and queue'
          git push origin HEAD:feat/background-reminders-phase1
