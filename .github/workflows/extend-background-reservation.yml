name: Extend background runtime reservation

on:
  push:
    branches:
      - chore/extend-background-reservation
    paths:
      - .github/workflows/extend-background-reservation.yml

permissions:
  contents: write

jobs:
  reserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extend reservation on master
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B master origin/master
          python - <<'PY'
          from pathlib import Path
          p=Path('AI_WORKSPACE.md')
          text=p.read_text(encoding='utf-8')
          old='`worker/index.ts`, `worker/backgroundAcademic.ts`, `.github/workflows/deploy-navixa-auto.yml`, `tests/important-reminders.test.ts`, `AI_WORKSPACE.md`, `AI_CHANGELOG.md`'
          new='`worker/index.ts`, `worker/backgroundAcademic.ts`, `vite.config.ts`, `.github/workflows/deploy-navixa-auto.yml`, `tests/important-reminders.test.ts`, `AI_WORKSPACE.md`, `AI_CHANGELOG.md`'
          if old not in text: raise SystemExit('reservation anchor missing')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'NAVIXA coordination'
          git config user.email 'actions@users.noreply.github.com'
          git add AI_WORKSPACE.md
          git commit -m 'chore: extend background runtime reservation'
          git push origin HEAD:master
