name: Verify NAVIXA Education Extraction

on:
  pull_request:
    branches: [master]
    paths:
      - "extraction/navixa-education/**"
      - ".github/workflows/navixa-education-extraction-verify.yml"

permissions:
  contents: read

concurrency:
  group: navixa-education-extraction-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-education-extraction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify isolated Education extraction
        working-directory: extraction/navixa-education
        run: npm test
