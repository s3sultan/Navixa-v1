name: Apply meeting recorder fix

on:
  push:
    branches:
      - fix/meeting-independent-recording-parts-20260913
    paths:
      - scripts/apply-meeting-recorder-fix.mjs
      - .github/workflows/apply-meeting-recorder-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/meeting-independent-recording-parts-20260913
          fetch-depth: 0
      - name: Apply guarded source migration
        run: node scripts/apply-meeting-recorder-fix.mjs
      - name: Commit migrated source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/meetings/MeetingStudio.tsx; then
            echo "Migration produced no source changes."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/meetings/MeetingStudio.tsx
          git commit -m "fix(meetings): rotate independent recording parts"
          git push origin HEAD:fix/meeting-independent-recording-parts-20260913
