name: Generate security dependency lock

on:
  push:
    branches: [security/deps-2026-09-04]
    paths:
      - "package.json"
      - ".github/workflows/security-deps-lock.yml"

permissions:
  contents: write

concurrency:
  group: navixa-security-deps-lock-v2
  cancel-in-progress: false

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v6
        with:
          ref: security/deps-2026-09-04

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Regenerate npm lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated lock if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate lock for security dependency updates"
          git push origin HEAD:security/deps-2026-09-04
