name: Cloudflare background architecture docs

on:
  push:
    branches:
      - docs/cloudflare-background-architecture
    paths:
      - .github/workflows/cloudflare-background-architecture-docs.yml

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/cloudflare-background-architecture
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Record approved background architecture
        shell: python
        run: |
          from pathlib import Path

          memory = Path('PROJECT_MEMORY.md')
          text = memory.read_text(encoding='utf-8')
          block = '''## بنية المهام الخلفية المعتمدة\n\n- اعتمد المستخدم بنية Cloudflare للمهام الخلفية على النحو التالي: `Cron Trigger → Cloudflare Workflow → Queue → Web Push/Telegram`.\n- يستخدم Cron لإيقاظ المهام الدورية فقط، بينما يدير Workflow العمليات متعددة الخطوات وإعادة المحاولة وحفظ الحالة، وتستخدم Queue لتوزيع الحمل والتسليم الموثوق.\n- تستخدم Durable Object Alarms للمواعيد الدقيقة الخاصة بكل مستخدم بدل الاعتماد على Cron العام عندما تكون الجدولة فردية ودقيقة.\n- يبدأ التطبيق العملي بهذه البنية للتنبيهات الأكاديمية والمواعيد المهمة التي يجب أن تعمل حتى لو لم يفتح المستخدم الموقع.\n- يجب أن يكون التفعيل تدريجيًا وقابلًا للرجوع، مع عدم تغيير تسجيل الدخول أو OTP أو Push الحالي أو الدفع إلا ضمن مهمة مستقلة مع اختبارات.\n\n'''
          if '## بنية المهام الخلفية المعتمدة' not in text:
              anchor = '## تنسيق عمل المساعدين'
              if anchor not in text:
                  raise SystemExit('PROJECT_MEMORY anchor missing')
              text = text.replace(anchor, block + anchor, 1)
              memory.write_text(text, encoding='utf-8')

          workspace = Path('AI_WORKSPACE.md')
          text = workspace.read_text(encoding='utf-8')
          start = text.index('## حالة العمل')
          end = text.index('## مهمة سابقة', start)
          state = '''## حالة العمل\n\n- الوكيل النشط: لا يوجد حجز منتج نشط لهذه المهمة.\n- المهمة الحالية: اعتماد بنية Cloudflare للمهام الخلفية في NAVIXA.\n- الحالة: القرار موثق فقط؛ لا يوجد تغيير Runtime أو نشر ناتج عن هذه المهمة.\n- البنية المعتمدة: `Cron Trigger → Cloudflare Workflow → Queue → Web Push/Telegram`، مع `Durable Object Alarms` للمواعيد الدقيقة لكل مستخدم.\n- الملفات المحجوزة: محررة؛ لا يوجد حجز نشط بسبب هذا القرار التوثيقي.\n- التالي المقترح: تنفيذ مرحلة أولى معزولة للتنبيهات الأكاديمية والمواعيد المهمة، مع idempotency وretry ومراقبة واضحة، بعد بدء مهمة تنفيذ مستقلة.\n\n'''
          workspace.write_text(text[:start] + state + text[end:], encoding='utf-8')

          changelog = Path('AI_CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = 'لا تُعدّل السجلات السابقة. أضف السجل الأحدث في الأعلى تحت هذا السطر.\n\n'
          entry = '''## 2026-09-14 — ChatGPT\n\n- وثّق اعتماد بنية المهام الخلفية لـNAVIXA: `Cron Trigger → Cloudflare Workflow → Queue → Web Push/Telegram`، مع Durable Object Alarms للمواعيد الفردية الدقيقة.\n- حدد أول استخدام مقترح للتنفيذ لاحقًا: التنبيهات الأكاديمية والمواعيد المهمة التي تعمل حتى عند عدم فتح الموقع.\n- لا يوجد في هذا التغيير أي Runtime أو نشر أو تعديل تسجيل دخول/OTP/Push/دفع.\n- الملفات: `PROJECT_MEMORY.md`, `AI_WORKSPACE.md`, `AI_CHANGELOG.md`.\n\n'''
          if entry not in text:
              if marker not in text:
                  raise SystemExit('AI_CHANGELOG marker missing')
              text = text.replace(marker, marker + entry, 1)
              changelog.write_text(text, encoding='utf-8')
      - name: Verify documentation decision
        run: |
          grep -F 'Cron Trigger → Cloudflare Workflow → Queue → Web Push/Telegram' PROJECT_MEMORY.md
          grep -F 'Durable Object Alarms' PROJECT_MEMORY.md
          grep -F 'لا يوجد تغيير Runtime' AI_WORKSPACE.md
      - name: Commit documentation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'NAVIXA automation'
          git config user.email 'actions@users.noreply.github.com'
          git add PROJECT_MEMORY.md AI_WORKSPACE.md AI_CHANGELOG.md
          git commit -m 'docs: adopt Cloudflare background architecture'
          git push origin HEAD:docs/cloudflare-background-architecture
