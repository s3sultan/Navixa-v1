name: Deploy NAVIXA Staging

on:
  workflow_dispatch:
  push:
    branches: [staging, security/hardening-2026-09-04]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: navixa-staging
  cancel-in-progress: false

jobs:
  build-and-deploy-staging:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies without deployment secrets
        run: npm ci

      - name: Stage stricter CSP report-only experiment
        if: github.ref == 'refs/heads/security/hardening-2026-09-04'
        run: |
          set -euo pipefail
          cp tests/staging-csp-probe-middleware.ts middleware.ts
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'worker/index.ts';
          let source = fs.readFileSync(path, 'utf8');
          const scriptBefore = "script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://accounts.google.com https://cdn.jsdelivr.net";
          const scriptAfter = "script-src 'self' https://static.cloudflareinsights.com https://accounts.google.com https://cdn.jsdelivr.net";
          const styleBefore = "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net";
          const styleAfter = "style-src 'self' https://fonts.googleapis.com https://cdn.jsdelivr.net";
          const reportOnlyBefore = 'response.headers.set("Content-Security-Policy-Report-Only", CSP_REPORT_ONLY);';
          const reportOnlyAfter = `const existingReportOnly = response.headers.get("Content-Security-Policy-Report-Only");\n  if (!existingReportOnly?.includes("'nonce-")) response.headers.set("Content-Security-Policy-Report-Only", CSP_REPORT_ONLY);`;
          if (!source.includes(scriptBefore) || !source.includes(styleBefore) || !source.includes(reportOnlyBefore)) {
            throw new Error('Expected CSP staging patch points were not found');
          }
          source = source
            .replace(scriptBefore, scriptAfter)
            .replace(styleBefore, styleAfter)
            .replace(reportOnlyBefore, reportOnlyAfter);
          fs.writeFileSync(path, source);
          NODE

      - name: Build NAVIXA without deployment secrets
        run: npm run build

      - name: Ensure staging D1 exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          existing=$(npx --no-install wrangler d1 list)
          database_id=$(printf '%s\n' "$existing" | grep 'navixa-staging' | grep -Eo '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' | head -n 1 || true)
          if [ -z "$database_id" ]; then
            created=$(npx --no-install wrangler d1 create navixa-staging)
            database_id=$(printf '%s\n' "$created" | grep -Eo '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' | head -n 1 || true)
          fi
          test -n "$database_id" || { echo "Could not resolve navixa-staging database id"; exit 1; }
          echo "STAGING_D1_DATABASE_ID=$database_id" >> "$GITHUB_ENV"

      - name: Verify staging secret readiness
        env:
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET_STAGING }}
        run: |
          set -euo pipefail
          test "${#ADMIN_JWT_SECRET}" -ge 32 || { echo "ADMIN_JWT_SECRET_STAGING must be at least 32 characters"; exit 1; }
          test -n "$STAGING_D1_DATABASE_ID" || { echo "STAGING_D1_DATABASE_ID is missing"; exit 1; }

      - name: Configure staging Worker
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'dist/server/wrangler.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.name = 'navixa-staging';
          config.observability = { enabled: true, head_sampling_rate: 1 };
          config.compatibility_flags = [...new Set([...(config.compatibility_flags || []), 'nodejs_compat'])];
          config.triggers = { ...(config.triggers || {}), crons: ['* * * * *'] };
          if (Array.isArray(config.d1_databases)) {
            for (const binding of config.d1_databases) {
              binding.database_id = process.env.STAGING_D1_DATABASE_ID;
              binding.database_name = 'navixa-staging';
            }
          }
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Prepare staging D1 migrations
        run: |
          set -euo pipefail
          test -d migrations || { echo "migrations directory is missing"; exit 1; }
          mkdir -p dist/server/migrations
          cp migrations/*.sql dist/server/migrations/
          test -n "$(find dist/server/migrations -maxdepth 1 -name '*.sql' -print -quit)"

      - name: Apply staging D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler d1 migrations apply navixa-staging --remote --config dist/server/wrangler.json

      - name: Upload staging admin JWT secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET_STAGING }}
        run: |
          set -euo pipefail
          printf '%s' "$ADMIN_JWT_SECRET" | npx --no-install wrangler secret put ADMIN_JWT_SECRET --config dist/server/wrangler.json --name navixa-staging

      - name: Deploy navixa-staging Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json --name navixa-staging

      - name: Verify deployed staging runtime and security headers
        env:
          STAGING_URL: https://navixa-staging.s2shug.workers.dev
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 30); do
            code=$(curl -sS --connect-timeout 5 --max-time 15 -D /tmp/navixa-staging-headers.txt -o /tmp/navixa-staging-body.html -w '%{http_code}' "$STAGING_URL/?runtime_probe=${GITHUB_SHA}" || true)
            if [ "$code" = "200" ]; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1 || { echo "Staging did not become ready"; exit 1; }
          grep -Eqi '^content-security-policy:.*script-src-attr '\''none'\''' /tmp/navixa-staging-headers.txt
          grep -Eqi '^content-security-policy-report-only:' /tmp/navixa-staging-headers.txt
          grep -Eqi '^x-permitted-cross-domain-policies:[[:space:]]*none' /tmp/navixa-staging-headers.txt
          grep -Eqi '^x-content-type-options:[[:space:]]*nosniff' /tmp/navixa-staging-headers.txt
          grep -Eqi 'NAVIXA|navixa' /tmp/navixa-staging-body.html

          if [ "${GITHUB_REF}" = "refs/heads/security/hardening-2026-09-04" ]; then
            report_only=$(grep -Ei '^content-security-policy-report-only:' /tmp/navixa-staging-headers.txt | tr -d '\r')
            if printf '%s' "$report_only" | grep -qi "unsafe-inline"; then
              echo "Strict staging CSP experiment was not applied"
              exit 1
            fi
          fi

          for path in / /today /account /admin/login /meetings; do
            code=$(curl -sS --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' "$STAGING_URL$path?runtime_probe=${GITHUB_SHA}")
            case "$code" in
              2*|3*|401|403) ;;
              *) echo "Unexpected staging status $code for $path"; exit 1 ;;
            esac
          done

          origin_status=$(curl -sS --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' \
            -X POST -H 'Origin: https://attacker.example' -H 'Content-Type: application/json' \
            --data '{}' "$STAGING_URL/api/account/passkeys/register/options")
          test "$origin_status" = "403" || { echo "Passkey same-origin guard returned $origin_status"; exit 1; }

      - name: Probe nonce-based script CSP compatibility with Chrome CDP
        if: github.ref == 'refs/heads/security/hardening-2026-09-04'
        env:
          STAGING_URL: https://navixa-staging.s2shug.workers.dev
          CHROME_BIN: google-chrome
        run: node tests/staging-csp-smoke.mjs
