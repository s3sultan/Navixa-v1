name: Deploy NAVIXA Staging

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: navixa-staging
  cancel-in-progress: false

jobs:
  build-and-deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET_STAGING }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build NAVIXA
        run: npm run build

      - name: Ensure staging D1 exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          existing=$(npx --no-install wrangler d1 list)
          database_id=$(printf '%s\n' "$existing" | grep 'navixa-staging' | grep -Eo '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' | head -n 1 || true)
          if [ -z "$database_id" ]; then
            created=$(npx --no-install wrangler d1 create navixa-staging)
            database_id=$(printf '%s\n' "$created" | grep -Eo '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' | head -n 1 || true)
          fi
          test -n "$database_id" || { echo "Could not resolve navixa-staging database id"; exit 1; }
          echo "STAGING_D1_DATABASE_ID=$database_id" >> "$GITHUB_ENV"

      - name: Verify staging secrets
        run: |
          test -n "$ADMIN_JWT_SECRET" || { echo "ADMIN_JWT_SECRET_STAGING is missing"; exit 1; }
          test -n "$STAGING_D1_DATABASE_ID" || { echo "STAGING_D1_DATABASE_ID is missing"; exit 1; }

      - name: Configure staging Worker
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'dist/server/wrangler.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.name = 'navixa-staging';
          config.observability = { enabled: true, head_sampling_rate: 1 };
          if (Array.isArray(config.d1_databases)) {
            for (const binding of config.d1_databases) {
              binding.database_id = process.env.STAGING_D1_DATABASE_ID;
              binding.database_name = 'navixa-staging';
            }
          }
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Prepare staging D1 migrations
        run: |
          test -d migrations || { echo "migrations directory is missing"; exit 1; }
          mkdir -p dist/server/migrations
          cp migrations/*.sql dist/server/migrations/
          test -n "$(find dist/server/migrations -maxdepth 1 -name '*.sql' -print -quit)"

      - name: Apply staging D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler d1 migrations apply navixa-staging --remote --config dist/server/wrangler.json

      - name: Upload staging admin JWT secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "$ADMIN_JWT_SECRET" | npx --no-install wrangler secret put ADMIN_JWT_SECRET --config dist/server/wrangler.json --name navixa-staging

      - name: Deploy navixa-staging Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json --name navixa-staging
