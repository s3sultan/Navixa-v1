name: NAVIXA UI System Preview

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "app/ui-system/**"
      - "app/ui-lab/**"
      - "tests/navixa-ui-system.test.ts"
      - "tests/ui-system-smoke.mjs"
      - ".github/workflows/ui-system-preview.yml"

permissions:
  contents: read

concurrency:
  group: navixa-ui-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Chrome
        run: google-chrome --version

      - name: Capture responsive UI evidence
        env:
          CHROME_BIN: google-chrome
        run: node tests/ui-system-smoke.mjs

      - name: Upload responsive UI evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: navixa-ui-system-preview-${{ github.event.pull_request.number }}
          path: artifacts/ui-system/*.png
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
