name: Deploy NAVIXA Plan B

on:
  push:
    branches: [master]
    paths:
      - 'plan-b/**'
      - 'worker/planBAccess.ts'
      - 'worker/emergencyNotifications.ts'
      - 'tests/plan-b-access.test.ts'
      - '.github/workflows/deploy-navixa-plan-b.yml'
  workflow_dispatch:

concurrency:
  group: navixa-plan-b-production
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  deploy-plan-b:
    name: Deploy isolated fallback, drill grant, then wire primary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require merged pull request provenance
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          associated_prs="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")"
          if ! printf '%s' "$associated_prs" | jq -e 'map(select(.merged_at != null and .base.ref == "master")) | length > 0' >/dev/null; then
            echo "Plan B deployment refused: master commit lacks merged PR provenance."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Plan B contracts
        run: node --experimental-strip-types --test tests/plan-b-access.test.ts tests/emergency-mode.test.ts

      - name: Require deployment secrets
        env:
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test "${#ADMIN_JWT_SECRET}" -ge 32 || { echo "ADMIN_JWT_SECRET must be at least 32 characters"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }

      - name: Derive isolated Plan B keys and deploy fallback
        env:
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          plan_b_secret_file="$RUNNER_TEMP/navixa-plan-b.secrets"
          signing_secret="$(LABEL='navixa-plan-b-signing-v1' node -e "const c=require('node:crypto');process.stdout.write(c.createHmac('sha256',process.env.ADMIN_JWT_SECRET).update(process.env.LABEL).digest('base64url'))")"
          test "${#signing_secret}" -ge 32
          printf 'NAVIXA_PLAN_B_SIGNING_SECRET=%s\n' "$signing_secret" > "$plan_b_secret_file"
          npx --no-install wrangler deploy --config plan-b/wrangler.jsonc --secrets-file "$plan_b_secret_file"
          rm -f "$plan_b_secret_file"

      - name: Verify independent fallback health
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 15 https://backup.navixasa.com/healthz > "$response"; then
              if jq -e '.ok == true and .service == "navixa-plan-b" and .verifierReady == true' "$response" >/dev/null; then
                echo "PASS backup.navixasa.com health"
                exit 0
              fi
            fi
            sleep 3
          done
          echo "FAIL backup.navixasa.com health"
          jq -c '{ok,service,mode,verifierReady}' "$response" 2>/dev/null || true
          exit 1

      - name: Run signed-grant end-to-end drill
        env:
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          signing_secret="$(LABEL='navixa-plan-b-signing-v1' node -e "const c=require('node:crypto');process.stdout.write(c.createHmac('sha256',process.env.ADMIN_JWT_SECRET).update(process.env.LABEL).digest('base64url'))")"
          entitlement_secret="$(LABEL='navixa-plan-b-entitlement-v1' node -e "const c=require('node:crypto');process.stdout.write(c.createHmac('sha256',process.env.ADMIN_JWT_SECRET).update(process.env.LABEL).digest('base64url'))")"
          smoke_grant="$(PLAN_B_SIGNING_SECRET="$signing_secret" PLAN_B_ENTITLEMENT_SECRET="$entitlement_secret" node --experimental-strip-types --input-type=module <<'NODE'
          import { issuePlanBGrant } from './worker/planBAccess.ts';
          import { emergencyEntitlementKey } from './worker/emergencyEntitlements.ts';
          const now = new Date();
          const email = 'plan-b-deployment-smoke@navixa.invalid';
          const entitlementSecret = process.env.PLAN_B_ENTITLEMENT_SECRET;
          const signingSecret = process.env.PLAN_B_SIGNING_SECRET;
          const snapshot = {
            version: 1,
            generatedAt: now.toISOString(),
            records: [{
              entitlementKey: await emergencyEntitlementKey(email, entitlementSecret),
              activeUntil: new Date(now.getTime() + 60 * 60 * 1000).toISOString(),
            }],
          };
          const token = await issuePlanBGrant({
            snapshot,
            email,
            entitlementSecret,
            signingSecret,
            emergencyState: 'outage',
            incidentId: 'deployment-smoke',
            now,
            ttlSeconds: 300,
          });
          process.stdout.write(token);
          NODE
          )"
          valid_response="$(mktemp)"
          valid_status="$(curl --silent --show-error --max-time 15 -o "$valid_response" -w '%{http_code}' \
            --request POST \
            --header 'Origin: https://backup.navixasa.com' \
            --header 'Content-Type: application/json' \
            --data "$(jq -cn --arg token "$smoke_grant" '{token:$token}')" \
            https://backup.navixasa.com/api/verify)"
          if [ "$valid_status" != "200" ]; then
            echo "Plan B valid-grant check failed: expected HTTP 200, got $valid_status"
            jq -c '{ok,error}' "$valid_response" 2>/dev/null || echo 'Plan B returned a non-JSON error response'
            exit 1
          fi
          if ! jq -e '.ok == true and .incident == "deployment-smoke" and (.expiresAt | type == "string") and (has("sub") | not)' "$valid_response" >/dev/null; then
            echo "Plan B valid-grant response shape rejected"
            jq -c '{ok,error,incident,expiresAt,hasSub:has("sub")}' "$valid_response" 2>/dev/null || true
            exit 1
          fi

          invalid_response="$(mktemp)"
          invalid_status="$(curl --silent --show-error --max-time 15 -o "$invalid_response" -w '%{http_code}' \
            --request POST \
            --header 'Origin: https://backup.navixasa.com' \
            --header 'Content-Type: application/json' \
            --data '{"token":"invalid"}' \
            https://backup.navixasa.com/api/verify)"
          if [ "$invalid_status" != "401" ]; then
            echo "Plan B invalid-grant check failed: expected HTTP 401, got $invalid_status"
            jq -c '{ok,error}' "$invalid_response" 2>/dev/null || echo 'Plan B returned a non-JSON error response'
            exit 1
          fi
          if ! jq -e '.ok == false and .error == "invalid_or_expired_grant"' "$invalid_response" >/dev/null; then
            echo "Plan B invalid-grant response shape rejected"
            jq -c '{ok,error}' "$invalid_response" 2>/dev/null || true
            exit 1
          fi
          echo "PASS Plan B signed-grant drill"

      - name: Wire verified Plan B into primary Worker
        env:
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          primary_secret_file="$RUNNER_TEMP/navixa-primary-plan-b-secrets.json"
          signing_secret="$(LABEL='navixa-plan-b-signing-v1' node -e "const c=require('node:crypto');process.stdout.write(c.createHmac('sha256',process.env.ADMIN_JWT_SECRET).update(process.env.LABEL).digest('base64url'))")"
          entitlement_secret="$(LABEL='navixa-plan-b-entitlement-v1' node -e "const c=require('node:crypto');process.stdout.write(c.createHmac('sha256',process.env.ADMIN_JWT_SECRET).update(process.env.LABEL).digest('base64url'))")"
          PLAN_B_SIGNING_SECRET="$signing_secret" PLAN_B_ENTITLEMENT_SECRET="$entitlement_secret" PLAN_B_URL='https://backup.navixasa.com' PRIMARY_SECRET_FILE="$primary_secret_file" node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync(process.env.PRIMARY_SECRET_FILE, JSON.stringify({
            NAVIXA_PLAN_B_SIGNING_SECRET: process.env.PLAN_B_SIGNING_SECRET,
            NAVIXA_EMERGENCY_ENTITLEMENT_SECRET: process.env.PLAN_B_ENTITLEMENT_SECRET,
            NAVIXA_PLAN_B_URL: process.env.PLAN_B_URL,
          }));
          NODE
          npx --no-install wrangler secret bulk "$primary_secret_file" --name navixa
          rm -f "$primary_secret_file"

      - name: Verify primary bindings by secret name only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          names="$(npx --no-install wrangler secret list --name navixa --format json)"
          printf '%s' "$names" | jq -e '[.[].name] | index("NAVIXA_PLAN_B_SIGNING_SECRET") != null' >/dev/null
          printf '%s' "$names" | jq -e '[.[].name] | index("NAVIXA_EMERGENCY_ENTITLEMENT_SECRET") != null' >/dev/null
          printf '%s' "$names" | jq -e '[.[].name] | index("NAVIXA_PLAN_B_URL") != null' >/dev/null
          curl --fail --silent --show-error --max-time 15 https://navixasa.com/ >/dev/null
          curl --fail --silent --show-error --max-time 15 https://backup.navixasa.com/access >/dev/null
          echo "PASS Plan B host and primary bindings"
