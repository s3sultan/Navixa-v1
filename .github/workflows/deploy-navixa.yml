name: Deploy NAVIXA
# Production is manual-only. PR verification and staging should complete first.

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Confirm production deployment after review and verification"
        required: true
        type: boolean
        default: false

concurrency:
  group: navixa-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    if: ${{ github.ref == 'refs/heads/master' && inputs.confirm_production == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
      NAVIXA_PORTFOLIO_PRIVATE_JWK: ${{ secrets.NAVIXA_PORTFOLIO_PRIVATE_JWK }}
      NAVIXA_TELEGRAM_BOT_TOKEN: ${{ secrets.NAVIXA_TELEGRAM_BOT_TOKEN }}
      NAVIXA_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.NAVIXA_TELEGRAM_WEBHOOK_SECRET }}
      NAVIXA_TELEGRAM_ENCRYPTION_KEY: ${{ secrets.NAVIXA_TELEGRAM_ENCRYPTION_KEY }}
      MOYASAR_TEST_PUBLISHABLE_KEY: ${{ secrets.MOYASAR_TEST_PUBLISHABLE_KEY }}
      MOYASAR_TEST_SECRET_KEY: ${{ secrets.MOYASAR_TEST_SECRET_KEY }}
      MOYASAR_TEST_WEBHOOK_SECRET: ${{ secrets.MOYASAR_TEST_WEBHOOK_SECRET }}
      MOYASAR_LIVE_PUBLISHABLE_KEY: ${{ secrets.MOYASAR_LIVE_PUBLISHABLE_KEY }}
      MOYASAR_LIVE_SECRET_KEY: ${{ secrets.MOYASAR_LIVE_SECRET_KEY }}
      MOYASAR_LIVE_WEBHOOK_SECRET: ${{ secrets.MOYASAR_LIVE_WEBHOOK_SECRET }}
    steps:
      - name: Read official source
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run NAVIXA local verification
        env:
          CHROME_BIN: google-chrome
        run: |
          google-chrome --version
          npm run test:local

      - name: Build NAVIXA
        run: npm run build

      - name: Deployment held until administration secret is configured
        if: env.ADMIN_JWT_SECRET == ''
        run: |
          echo "Deployment skipped safely: configure ADMIN_JWT_SECRET in GitHub Actions secrets, then run this workflow again."

      - name: Prepare production D1 migrations
        if: env.ADMIN_JWT_SECRET != ''
        run: |
          test -d migrations || { echo "migrations directory is missing"; exit 1; }
          mkdir -p dist/server/migrations
          cp migrations/*.sql dist/server/migrations/

      - name: Apply production D1 migrations
        if: env.ADMIN_JWT_SECRET != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler d1 migrations apply navixa-db --remote --config dist/server/wrangler.json

      - name: Enable Worker observability and preserve remote bindings
        if: env.ADMIN_JWT_SECRET != ''
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'dist/server/wrangler.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.observability = { enabled: true, head_sampling_rate: 1 };
          config.compatibility_flags = [...new Set([...(config.compatibility_flags || []), 'nodejs_compat'])];
          config.triggers = { ...(config.triggers || {}), crons: ['* * * * *'] };
          config.keep_vars = true;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Report OTP provider readiness
        if: env.ADMIN_JWT_SECRET != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            echo "OTP delivery secret supplied by GitHub Actions."
            exit 0
          fi
          secret_names=$(npx --no-install wrangler secret list --config dist/server/wrangler.json --name navixa || true)
          if printf '%s' "$secret_names" | grep -q 'RESEND_API_KEY'; then
            echo "Existing production OTP secret found and will be preserved."
          else
            echo "::warning::RESEND_API_KEY is currently unavailable. Google login stays available and production deploy will continue safely."
          fi

      - name: Deploy the navixa Worker
        if: env.ADMIN_JWT_SECRET != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json --name navixa

      - name: Upload admin JWT secret
        if: env.ADMIN_JWT_SECRET != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "$ADMIN_JWT_SECRET" | npx --no-install wrangler secret put ADMIN_JWT_SECRET --config dist/server/wrangler.json --name navixa

      - name: Ensure persistent production Push VAPID keys
        if: env.ADMIN_JWT_SECRET != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          secret_names=$(npx --no-install wrangler secret list --config dist/server/wrangler.json --name navixa || true)
          has_public=0
          has_private=0
          printf '%s' "$secret_names" | grep -q 'VAPID_PUBLIC_KEY' && has_public=1 || true
          printf '%s' "$secret_names" | grep -q 'VAPID_PRIVATE_KEY' && has_private=1 || true

          if [ "$has_public" -eq 1 ] && [ "$has_private" -eq 1 ]; then
            echo "Existing production VAPID key pair found; preserving it."
          else
            echo "Production VAPID pair is missing or incomplete; generating one stable pair."
            node <<'NODE' > /tmp/navixa-vapid.env
          import webpush from 'web-push';
          const keys = webpush.generateVAPIDKeys();
          process.stdout.write(`VAPID_PUBLIC_KEY=${keys.publicKey}\nVAPID_PRIVATE_KEY=${keys.privateKey}\n`);
          NODE
            public_key=$(grep '^VAPID_PUBLIC_KEY=' /tmp/navixa-vapid.env | cut -d= -f2-)
            private_key=$(grep '^VAPID_PRIVATE_KEY=' /tmp/navixa-vapid.env | cut -d= -f2-)
            test -n "$public_key"
            test -n "$private_key"
            printf '%s' "$public_key" | npx --no-install wrangler secret put VAPID_PUBLIC_KEY --config dist/server/wrangler.json --name navixa
            printf '%s' "$private_key" | npx --no-install wrangler secret put VAPID_PRIVATE_KEY --config dist/server/wrangler.json --name navixa
            rm -f /tmp/navixa-vapid.env
          fi

          printf '%s' 'https://navixasa.com' | npx --no-install wrangler secret put VAPID_SUBJECT --config dist/server/wrangler.json --name navixa

          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error https://navixasa.com/api/push/config | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.exit(j.enabled&&j.publicKey?0:1)})"; then
              echo "Production Push configuration is ready."
              exit 0
            fi
            echo "Waiting for Push secrets to become active (attempt ${attempt}/5)..."
            sleep 3
          done
          echo "Push secrets were uploaded, but the public configuration endpoint is not ready yet."
          exit 1

      - name: Upload NAVIXA portfolio private key
        if: env.ADMIN_JWT_SECRET != '' && env.NAVIXA_PORTFOLIO_PRIVATE_JWK != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "$NAVIXA_PORTFOLIO_PRIVATE_JWK" | npx --no-install wrangler secret put NAVIXA_PORTFOLIO_PRIVATE_JWK --config dist/server/wrangler.json --name navixa

      - name: Upload OTP email secrets when configured
        if: env.ADMIN_JWT_SECRET != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NAVIXA_AUTH_FROM: ${{ secrets.NAVIXA_AUTH_FROM }}
          NAVIXA_AUTH_CODE_PEPPER: ${{ secrets.NAVIXA_AUTH_CODE_PEPPER }}
        run: |
          upload_secret() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx --no-install wrangler secret put "$name" --config dist/server/wrangler.json --name navixa
            fi
          }
          upload_secret RESEND_API_KEY "$RESEND_API_KEY"
          upload_secret NAVIXA_AUTH_FROM "$NAVIXA_AUTH_FROM"
          upload_secret NAVIXA_AUTH_CODE_PEPPER "$NAVIXA_AUTH_CODE_PEPPER"

      - name: Upload Telegram secrets when configured
        if: env.ADMIN_JWT_SECRET != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          upload_secret() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx --no-install wrangler secret put "$name" --config dist/server/wrangler.json --name navixa
            fi
          }
          upload_secret NAVIXA_TELEGRAM_BOT_TOKEN "$NAVIXA_TELEGRAM_BOT_TOKEN"
          upload_secret NAVIXA_TELEGRAM_ENCRYPTION_KEY "$NAVIXA_TELEGRAM_ENCRYPTION_KEY"

          webhook_secret="$NAVIXA_TELEGRAM_WEBHOOK_SECRET"
          if [ -z "$webhook_secret" ]; then
            webhook_secret=$(node -e "const c=require('node:crypto'); process.stdout.write(c.createHash('sha256').update('navixa:telegram:webhook:'+process.env.ADMIN_JWT_SECRET).digest('base64url'))")
          fi
          test -n "$webhook_secret"
          printf '%s' "$webhook_secret" | npx --no-install wrangler secret put NAVIXA_TELEGRAM_WEBHOOK_SECRET --config dist/server/wrangler.json --name navixa
          printf '%s' "$webhook_secret" > /tmp/navixa-telegram-webhook-secret
          chmod 600 /tmp/navixa-telegram-webhook-secret
          echo "Telegram webhook secret synchronized with the Worker."

      - name: Restore and directly verify Telegram webhook
        if: env.ADMIN_JWT_SECRET != '' && env.NAVIXA_TELEGRAM_BOT_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          webhook_url="https://navixasa.com/api/telegram/webhook"
          webhook_secret=$(cat /tmp/navixa-telegram-webhook-secret)
          test -n "$webhook_secret"

          response=$(curl --fail-with-body --silent --show-error \
            --request POST "https://api.telegram.org/bot${NAVIXA_TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=${webhook_url}" \
            --data-urlencode "secret_token=${webhook_secret}" \
            --data-urlencode 'allowed_updates=["message"]')
          printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.ok)process.exit(1);console.log('Telegram webhook registered')})"

          verified=0
          for attempt in 1 2 3 4 5; do
            status=$(curl --silent --show-error --output /tmp/navixa-telegram-probe.json --write-out '%{http_code}' \
              --request POST "$webhook_url" \
              --header "Content-Type: application/json" \
              --header "X-Telegram-Bot-Api-Secret-Token: ${webhook_secret}" \
              --data '{"update_id":0}')
            if [ "$status" = "200" ]; then
              verified=1
              break
            fi
            echo "Telegram webhook probe returned HTTP ${status}; retrying (${attempt}/5)..."
            sleep 2
          done
          rm -f /tmp/navixa-telegram-webhook-secret /tmp/navixa-telegram-probe.json
          if [ "$verified" -ne 1 ]; then
            echo "Telegram webhook rejected the exact secret configured for Telegram."
            exit 1
          fi

          info=$(curl --fail-with-body --silent --show-error "https://api.telegram.org/bot${NAVIXA_TELEGRAM_BOT_TOKEN}/getWebhookInfo")
          WEBHOOK_URL="$webhook_url" printf '%s' "$info" | WEBHOOK_URL="$webhook_url" node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const r=j.result||{};if(!j.ok||r.url!==process.env.WEBHOOK_URL){console.error('Telegram webhook verification failed');process.exit(1)};console.log('Telegram webhook authenticated and verified:',r.url)})"

      - name: Upload Moyasar secrets when configured
        if: env.ADMIN_JWT_SECRET != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          upload_secret() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx --no-install wrangler secret put "$name" --config dist/server/wrangler.json --name navixa
            fi
          }
          upload_secret MOYASAR_TEST_PUBLISHABLE_KEY "$MOYASAR_TEST_PUBLISHABLE_KEY"
          upload_secret MOYASAR_TEST_SECRET_KEY "$MOYASAR_TEST_SECRET_KEY"
          upload_secret MOYASAR_TEST_WEBHOOK_SECRET "$MOYASAR_TEST_WEBHOOK_SECRET"
          upload_secret MOYASAR_LIVE_PUBLISHABLE_KEY "$MOYASAR_LIVE_PUBLISHABLE_KEY"
          upload_secret MOYASAR_LIVE_SECRET_KEY "$MOYASAR_LIVE_SECRET_KEY"
          upload_secret MOYASAR_LIVE_WEBHOOK_SECRET "$MOYASAR_LIVE_WEBHOOK_SECRET"
