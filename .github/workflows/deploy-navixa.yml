name: Deploy NAVIXA

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: navixa-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
      NAVIXA_PORTFOLIO_PRIVATE_JWK: ${{ secrets.NAVIXA_PORTFOLIO_PRIVATE_JWK }}
      NAVIXA_TELEGRAM_BOT_TOKEN: ${{ secrets.NAVIXA_TELEGRAM_BOT_TOKEN }}
      NAVIXA_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.NAVIXA_TELEGRAM_WEBHOOK_SECRET }}
      NAVIXA_TELEGRAM_ENCRYPTION_KEY: ${{ secrets.NAVIXA_TELEGRAM_ENCRYPTION_KEY }}
      MOYASAR_TEST_PUBLISHABLE_KEY: ${{ secrets.MOYASAR_TEST_PUBLISHABLE_KEY }}
      MOYASAR_TEST_SECRET_KEY: ${{ secrets.MOYASAR_TEST_SECRET_KEY }}
      MOYASAR_TEST_WEBHOOK_SECRET: ${{ secrets.MOYASAR_TEST_WEBHOOK_SECRET }}
      MOYASAR_LIVE_PUBLISHABLE_KEY: ${{ secrets.MOYASAR_LIVE_PUBLISHABLE_KEY }}
      MOYASAR_LIVE_SECRET_KEY: ${{ secrets.MOYASAR_LIVE_SECRET_KEY }}
      MOYASAR_LIVE_WEBHOOK_SECRET: ${{ secrets.MOYASAR_LIVE_WEBHOOK_SECRET }}
    steps:
      - name: Read official source
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run NAVIXA local verification
        env:
          CHROME_BIN: google-chrome
        run: |
          google-chrome --version
          npm run test:local

      - name: Build NAVIXA
        run: npm run build

      - name: Deployment held until administration secret is configured
        if: env.ADMIN_JWT_SECRET == ''
        run: |
          echo "Deployment skipped safely: configure ADMIN_JWT_SECRET in GitHub Actions secrets, then run this workflow again."

      - name: Prepare production D1 migrations
        if: env.ADMIN_JWT_SECRET != ''
        run: |
          test -d migrations || { echo "migrations directory is missing"; exit 1; }
          mkdir -p dist/server/migrations
          cp migrations/*.sql dist/server/migrations/

      - name: Apply production D1 migrations
        if: env.ADMIN_JWT_SECRET != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler d1 migrations apply navixa-db --remote --config dist/server/wrangler.json

      - name: Enable Worker observability and preserve remote bindings
        if: env.ADMIN_JWT_SECRET != ''
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'dist/server/wrangler.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.observability = { enabled: true, head_sampling_rate: 1 };
          config.compatibility_flags = [...new Set([...(config.compatibility_flags || []), 'nodejs_compat'])];
          config.triggers = { ...(config.triggers || {}), crons: ['* * * * *'] };
          config.keep_vars = true;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Recover missing OTP secrets from last healthy Worker version
        if: env.ADMIN_JWT_SECRET != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$RESEND_API_KEY" ]; then
            echo "GitHub already supplies RESEND_API_KEY; historical recovery not needed."
            exit 0
          fi
          current=$(npx --no-install wrangler secret list --config dist/server/wrangler.json --name navixa)
          if printf '%s' "$current" | grep -q 'RESEND_API_KEY'; then
            echo "Production Worker already has RESEND_API_KEY; historical recovery not needed."
            exit 0
          fi
          recovery_version="7a4aedd6-738b-4f57-b056-891533cc1246"
          payload=$(node -e 'process.stdout.write(JSON.stringify({strategy:"percentage",versions:[{percentage:100,version_id:process.argv[1]}],annotations:{"workers/message":"Temporary NAVIXA auth-secret recovery before immediate current-code redeploy","workers/triggered_by":"auth-recovery"}}))' "$recovery_version")
          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/navixa/deployments?force=true" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          printf '%s' "$response" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success)process.exit(1);console.log("Historical auth bindings activated for recovery")})'
          sleep 2
          recovered=$(npx --no-install wrangler secret list --config dist/server/wrangler.json --name navixa)
          printf '%s' "$recovered" | grep -q 'RESEND_API_KEY' || { echo "Historical version did not restore RESEND_API_KEY"; exit 1; }
          printf '%s' "$recovered" | grep -q 'NAVIXA_AUTH_FROM' || { echo "Historical version did not restore NAVIXA_AUTH_FROM"; exit 1; }
          printf '%s' "$recovered" | grep -q 'NAVIXA_AUTH_CODE_PEPPER' || { echo "Historical version did not restore NAVIXA_AUTH_CODE_PEPPER"; exit 1; }
          echo "Historical OTP secrets restored; current code will be redeployed immediately."

      - name: Verify production OTP secret before deploy
        if: env.ADMIN_JWT_SECRET != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            echo "OTP delivery secret supplied by GitHub Actions."
            exit 0
          fi
          secret_names=$(npx --no-install wrangler secret list --config dist/server/wrangler.json --name navixa)
          printf '%s' "$secret_names" | grep -q 'RESEND_API_KEY' || { echo "RESEND_API_KEY is missing from GitHub Actions and the production Worker"; exit 1; }
          echo "Existing production OTP secret found and will be preserved."

      - name: Deploy the navixa Worker
        if: env.ADMIN_JWT_SECRET != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json --name navixa

      - name: Upload admin JWT secret
        if: env.ADMIN_JWT_SECRET != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "$ADMIN_JWT_SECRET" | npx --no-install wrangler secret put ADMIN_JWT_SECRET --config dist/server/wrangler.json --name navixa

      - name: Upload NAVIXA portfolio private key
        if: env.ADMIN_JWT_SECRET != '' && env.NAVIXA_PORTFOLIO_PRIVATE_JWK != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "$NAVIXA_PORTFOLIO_PRIVATE_JWK" | npx --no-install wrangler secret put NAVIXA_PORTFOLIO_PRIVATE_JWK --config dist/server/wrangler.json --name navixa

      - name: Upload OTP email secrets when configured
        if: env.ADMIN_JWT_SECRET != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NAVIXA_AUTH_FROM: ${{ secrets.NAVIXA_AUTH_FROM }}
          NAVIXA_AUTH_CODE_PEPPER: ${{ secrets.NAVIXA_AUTH_CODE_PEPPER }}
        run: |
          upload_secret() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx --no-install wrangler secret put "$name" --config dist/server/wrangler.json --name navixa
            fi
          }
          upload_secret RESEND_API_KEY "$RESEND_API_KEY"
          upload_secret NAVIXA_AUTH_FROM "$NAVIXA_AUTH_FROM"
          upload_secret NAVIXA_AUTH_CODE_PEPPER "$NAVIXA_AUTH_CODE_PEPPER"

      - name: Upload Telegram secrets when configured
        if: env.ADMIN_JWT_SECRET != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          upload_secret() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx --no-install wrangler secret put "$name" --config dist/server/wrangler.json --name navixa
            fi
          }
          upload_secret NAVIXA_TELEGRAM_BOT_TOKEN "$NAVIXA_TELEGRAM_BOT_TOKEN"
          upload_secret NAVIXA_TELEGRAM_WEBHOOK_SECRET "$NAVIXA_TELEGRAM_WEBHOOK_SECRET"
          upload_secret NAVIXA_TELEGRAM_ENCRYPTION_KEY "$NAVIXA_TELEGRAM_ENCRYPTION_KEY"

      - name: Restore Telegram webhook when bot token is configured
        if: env.ADMIN_JWT_SECRET != '' && env.NAVIXA_TELEGRAM_BOT_TOKEN != ''
        shell: bash
        run: |
          webhook_secret="$NAVIXA_TELEGRAM_WEBHOOK_SECRET"
          if [ -z "$webhook_secret" ]; then
            webhook_secret=$(node -e "const c=require('node:crypto'); process.stdout.write(c.createHash('sha256').update('navixa:telegram:webhook:'+process.env.ADMIN_JWT_SECRET).digest('base64url'))")
          fi
          response=$(curl --fail-with-body --silent --show-error \
            --request POST "https://api.telegram.org/bot${NAVIXA_TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=https://navixa.s2shug.workers.dev/api/telegram/webhook" \
            --data-urlencode "secret_token=${webhook_secret}" \
            --data-urlencode 'allowed_updates=["message"]')
          printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.ok)process.exit(1);console.log('Telegram webhook ready')})"

      - name: Upload Moyasar secrets when configured
        if: env.ADMIN_JWT_SECRET != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          upload_secret() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx --no-install wrangler secret put "$name" --config dist/server/wrangler.json --name navixa
            fi
          }
          upload_secret MOYASAR_TEST_PUBLISHABLE_KEY "$MOYASAR_TEST_PUBLISHABLE_KEY"
          upload_secret MOYASAR_TEST_SECRET_KEY "$MOYASAR_TEST_SECRET_KEY"
          upload_secret MOYASAR_TEST_WEBHOOK_SECRET "$MOYASAR_TEST_WEBHOOK_SECRET"
          upload_secret MOYASAR_LIVE_PUBLISHABLE_KEY "$MOYASAR_LIVE_PUBLISHABLE_KEY"
          upload_secret MOYASAR_LIVE_SECRET_KEY "$MOYASAR_LIVE_SECRET_KEY"
          upload_secret MOYASAR_LIVE_WEBHOOK_SECRET "$MOYASAR_LIVE_WEBHOOK_SECRET"
