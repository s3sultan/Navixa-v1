name: Deploy NAVIXA

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: navixa-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - name: Read official source
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build NAVIXA
        run: npm run build

      - name: Deployment held until administration secret is configured
        if: env.ADMIN_JWT_SECRET == ''
        run: |
          echo "Deployment skipped safely: configure ADMIN_JWT_SECRET in GitHub Actions secrets, then run this workflow again."

      - name: Prepare production D1 migrations
        if: env.ADMIN_JWT_SECRET != ''
        run: |
          test -d migrations || { echo "migrations directory is missing"; exit 1; }
          mkdir -p dist/server/migrations
          cp migrations/*.sql dist/server/migrations/

      - name: Apply production D1 migrations
        if: env.ADMIN_JWT_SECRET != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler d1 migrations apply navixa-db --remote --config dist/server/wrangler.json

      - name: Enable Worker observability
        if: env.ADMIN_JWT_SECRET != ''
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'dist/server/wrangler.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.observability = { enabled: true, head_sampling_rate: 1 };
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Upload admin JWT secret
        if: env.ADMIN_JWT_SECRET != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "$ADMIN_JWT_SECRET" | npx --no-install wrangler secret put ADMIN_JWT_SECRET --config dist/server/wrangler.json --name navixa

      - name: Upload optional football data secret
        if: env.ADMIN_JWT_SECRET != '' && env.API_FOOTBALL_KEY != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' "$API_FOOTBALL_KEY" | npx --no-install wrangler secret put API_FOOTBALL_KEY --config dist/server/wrangler.json --name navixa

      - name: Deploy the navixa Worker
        if: env.ADMIN_JWT_SECRET != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json --name navixa
