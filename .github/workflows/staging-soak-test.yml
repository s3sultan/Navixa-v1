name: NAVIXA Staging Soak Test

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: "Full staging Worker URL"
        required: true
        type: string
      duration_minutes:
        description: "Duration in minutes"
        required: false
        default: "30"
        type: string
      interval_seconds:
        description: "Seconds between requests"
        required: false
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  soak-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Validate inputs
        env:
          STAGING_URL: ${{ inputs.staging_url }}
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
          INTERVAL_SECONDS: ${{ inputs.interval_seconds }}
        run: |
          case "$STAGING_URL" in https://*) ;; *) echo "staging_url must use https"; exit 1;; esac
          test "$DURATION_MINUTES" -ge 1 -a "$DURATION_MINUTES" -le 60 || { echo "duration_minutes must be between 1 and 60"; exit 1; }
          test "$INTERVAL_SECONDS" -ge 1 -a "$INTERVAL_SECONDS" -le 60 || { echo "interval_seconds must be between 1 and 60"; exit 1; }

      - name: Run 30 minute low-rate soak test
        env:
          STAGING_URL: ${{ inputs.staging_url }}
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
          INTERVAL_SECONDS: ${{ inputs.interval_seconds }}
        run: |
          set -euo pipefail
          out=/tmp/navixa-staging-soak.csv
          printf 'timestamp,http_code,time_total,time_starttransfer\n' > "$out"
          duration=$((DURATION_MINUTES * 60))
          end=$(( $(date +%s) + duration ))
          while [ "$(date +%s)" -lt "$end" ]; do
            timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            line=$(curl -sS --connect-timeout 5 --max-time 15 -o /dev/null \
              -w "%{http_code},%{time_total},%{time_starttransfer}" "$STAGING_URL/" 2>/dev/null || printf '000,15.000,15.000')
            printf '%s,%s\n' "$timestamp" "$line" >> "$out"
            sleep "$INTERVAL_SECONDS"
          done
          total=$(awk 'NR>1{n++} END{print n+0}' "$out")
          successful=$(awk -F, '$2 ~ /^2/ {n++} END{print n+0}' "$out")
          rate_limited=$(awk -F, '$2 == 429 {n++} END{print n+0}' "$out")
          errors=$(awk -F, '$2 ~ /^5/ {n++} END{print n+0}' "$out")
          timeouts=$(awk -F, '$2 == 000 {n++} END{print n+0}' "$out")
          avg=$(awk -F, 'NR>1{sum+=$3;n++} END{if(n) printf "%.3f",sum/n; else print "0"}' "$out")
          p95=$(awk -F, 'NR>1{print $3}' "$out" | sort -n | awk -v n="$total" 'NR==int(n*0.95)+(n*0.95!=int(n*0.95)) {printf "%.3f",$1}')
          echo "requests=$total success_2xx=$successful status_429=$rate_limited server_5xx=$errors timeouts=$timeouts average_total_seconds=$avg p95_total_seconds=$p95"
          test "$errors" -eq 0 || { echo "5xx responses detected"; exit 1; }
          test "$rate_limited" -eq 0 || { echo "429 responses detected"; exit 1; }
