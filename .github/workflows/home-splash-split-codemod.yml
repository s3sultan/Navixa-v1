name: NAVIXA Home Splash Split Codemod

on:
  push:
    branches: [perf/home-splash-split-phase3]
    paths:
      - '.github/workflows/home-splash-split-codemod.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated splash branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/home-splash-split-phase3

      - name: Split welcome splash from homepage startup module
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          page_path = Path('app/page.tsx')
          page = page_path.read_text()
          anchor = 'const HomeVideoModal = dynamic(() => import("./home-performance/HomeVideoModal"), { ssr: false });\n'
          dynamic_line = 'const HomeWelcome = dynamic(() => import("./home-performance/HomeWelcome"), { ssr: false });\n'
          if dynamic_line not in page:
              if anchor not in page:
                  raise SystemExit('HomeVideoModal dynamic anchor not found')
              page = page.replace(anchor, anchor + dynamic_line, 1)

          start_marker = '    {welcomePreferenceReady&&!entered&&!hideWelcomeForever&&<section className="welcome"'
          end_marker = '\n    {(overviewVideoOpen||tutorialOpen)&&<HomeVideoModal'
          start = page.find(start_marker)
          end = page.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Welcome block boundaries not found')
          replacement = '    {welcomePreferenceReady&&!entered&&!hideWelcomeForever&&<HomeWelcome greeting={greeting} hideWelcomeForever={hideWelcomeForever} onEnter={()=>setEntered(true)} onOpenOverview={()=>setOverviewVideoOpen(true)} onToggleForever={toggleWelcomeForever}/>}'
          page = page[:start] + replacement + page[end:]
          if 'aria-label="لوحة ترحيب NAVIXA"' in page:
              raise SystemExit('Inline welcome markup still remains in app/page.tsx')
          page_path.write_text(page)

          test_path = Path('tests/mobile-startup.test.ts')
          tests = test_path.read_text()
          test_block = '''test("homepage lazy-loads the welcome splash", async () => {\n  const [page, welcome] = await Promise.all([\n    readFile(new URL("app/page.tsx", root), "utf8"),\n    readFile(new URL("app/home-performance/HomeWelcome.tsx", root), "utf8"),\n  ]);\n  assert.match(page, /dynamic\\(\\(\\) => import\\("\\.\\/home-performance\\/HomeWelcome"\\)/);\n  assert.match(page, /welcomePreferenceReady&&!entered&&!hideWelcomeForever&&<HomeWelcome/);\n  assert.doesNotMatch(page, /aria-label="لوحة ترحيب NAVIXA"/);\n  assert.match(welcome, /aria-label="لوحة ترحيب NAVIXA"/);\n  assert.match(welcome, /welcome-overview-video/);\n  assert.match(welcome, /welcome-persistent-toggle/);\n});\n\n'''
          if 'homepage lazy-loads the welcome splash' not in tests:
              marker = 'test("direct-entry hides welcome before hydration and persists the real preference key"'
              idx = tests.find(marker)
              if idx < 0:
                  raise SystemExit('Direct-entry test anchor not found')
              tests = tests[:idx] + test_block + tests[idx:]
              test_path.write_text(tests)
          PY
          git diff --check
          git grep -n -I -e 'HomeWelcome' -- app/page.tsx app/home-performance/HomeWelcome.tsx tests/mobile-startup.test.ts

      - name: Commit isolated splash split
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 's3sultan'
          git config user.email 's2shug@gmail.com'
          git add app/page.tsx tests/mobile-startup.test.ts
          git commit -m 'perf(home): lazy-load welcome splash'
          git push origin HEAD:perf/home-splash-split-phase3
