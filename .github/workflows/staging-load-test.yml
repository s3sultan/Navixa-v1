name: NAVIXA Staging Load Test

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: "NAVIXA staging Worker URL: https://navixa-staging.s2shug.workers.dev"
        required: true
        type: string
      requests:
        description: "Total requests"
        required: false
        default: "250"
        type: string
      concurrency:
        description: "Maximum concurrent requests"
        required: false
        default: "50"
        type: string

permissions:
  contents: read

jobs:
  load-test:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate inputs
        env:
          STAGING_URL: ${{ inputs.staging_url }}
          TOTAL_REQUESTS: ${{ inputs.requests }}
          CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          set -euo pipefail
          test "$STAGING_URL" = "https://navixa-staging.s2shug.workers.dev" || { echo "staging_url must be the NAVIXA staging Worker"; exit 1; }
          test "$CONCURRENCY" -ge 1 -a "$CONCURRENCY" -le 50 || { echo "concurrency must be between 1 and 50"; exit 1; }
          test "$TOTAL_REQUESTS" -ge 50 -a "$TOTAL_REQUESTS" -le 1000 || { echo "requests must be between 50 and 1000"; exit 1; }

      - name: Run bounded load test
        env:
          STAGING_URL: ${{ inputs.staging_url }}
          TOTAL_REQUESTS: ${{ inputs.requests }}
          CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          set -euo pipefail
          rm -f /tmp/navixa-staging-load.csv
          seq "$TOTAL_REQUESTS" | xargs -n1 -P"$CONCURRENCY" -I{} \
            curl -sS --connect-timeout 5 --max-time 15 \
            -o /dev/null \
            -w '%{http_code},%{time_starttransfer},%{time_total}\n' \
            "$STAGING_URL/" >> /tmp/navixa-staging-load.csv
          total=$(wc -l < /tmp/navixa-staging-load.csv)
          errors=$(awk -F, '$1 ~ /^5/ {n++} END {print n+0}' /tmp/navixa-staging-load.csv)
          successful=$(awk -F, '$1 ~ /^2/ {n++} END {print n+0}' /tmp/navixa-staging-load.csv)
          avg=$(awk -F, '{sum+=$3} END {if(NR) printf "%.3f",sum/NR; else print "0"}' /tmp/navixa-staging-load.csv)
          p95=$(awk -F, '{print $3}' /tmp/navixa-staging-load.csv | sort -n | awk -v n="$total" 'NR==int(n*0.95)+(n*0.95!=int(n*0.95)) {printf "%.3f",$1}')
          echo "requests=$total success_2xx=$successful server_5xx=$errors average_total_seconds=$avg p95_total_seconds=$p95"
          test "$errors" -eq 0 || { echo "5xx responses detected"; exit 1; }
