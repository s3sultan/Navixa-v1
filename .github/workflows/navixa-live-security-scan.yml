name: NAVIXA Live Passive Security Scan

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/navixa-live-security-scan.yml"

permissions:
  contents: read

concurrency:
  group: navixa-live-passive-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  targeted-live-scan:
    name: NAVIXA-targeted Nuclei + headers
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check HTTPS and security headers
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/navixa-security"
          mkdir -p "$work"

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --max-time 20 \
            --user-agent 'NAVIXA-Authorized-Security-Scan/1.0' \
            --dump-header "$work/headers.txt" \
            --output /dev/null \
            https://navixasa.com/

          echo '=== Final response security headers ==='
          tr -d '\r' < "$work/headers.txt" | tail -n 80

          for header in \
            strict-transport-security \
            content-security-policy \
            x-content-type-options \
            referrer-policy \
            permissions-policy; do
            if ! grep -Eiq "^${header}:" "$work/headers.txt"; then
              echo "::warning::Missing security header: ${header}"
            fi
          done

          for path in /robots.txt /.well-known/security.txt; do
            status="$(curl --proto '=https' --tlsv1.2 --silent --show-error --location \
              --max-time 15 \
              --user-agent 'NAVIXA-Authorized-Security-Scan/1.0' \
              --output "$work/$(basename "$path").txt" \
              --write-out '%{http_code}' \
              "https://navixasa.com${path}")"
            echo "${path} -> HTTP ${status}"
          done

      - name: Build NAVIXA-specific passive Nuclei templates
        shell: bash
        run: |
          set -euo pipefail
          templates="$RUNNER_TEMP/navixa-nuclei"
          mkdir -p "$templates"

          cat > "$templates/env-exposure.yaml" <<'YAML'
          id: navixa-environment-file-exposure
          info:
            name: NAVIXA Environment File Exposure
            author: navixa-security
            severity: critical
          http:
            - method: GET
              path:
                - "{{BaseURL}}/.env"
                - "{{BaseURL}}/.env.local"
                - "{{BaseURL}}/.env.production"
                - "{{BaseURL}}/.env.production.local"
              matchers-condition: and
              matchers:
                - type: status
                  status: [200]
                - type: regex
                  part: body
                  regex:
                    - '(?m)^[A-Z][A-Z0-9_]{2,}=.+$'
          YAML

          cat > "$templates/git-config.yaml" <<'YAML'
          id: navixa-git-config-exposure
          info:
            name: NAVIXA Git Config Exposure
            author: navixa-security
            severity: high
          http:
            - method: GET
              path:
                - "{{BaseURL}}/.git/config"
              matchers-condition: and
              matchers:
                - type: status
                  status: [200]
                - type: regex
                  part: body
                  regex:
                    - '(?m)^\[core\]\s*$'
                    - '(?m)^\s*repositoryformatversion\s*='
          YAML

          cat > "$templates/package-token.yaml" <<'YAML'
          id: navixa-package-token-exposure
          info:
            name: NAVIXA Package Registry Token Exposure
            author: navixa-security
            severity: critical
          http:
            - method: GET
              path:
                - "{{BaseURL}}/.npmrc"
                - "{{BaseURL}}/.yarnrc"
                - "{{BaseURL}}/.yarnrc.yml"
              matchers-condition: and
              matchers:
                - type: status
                  status: [200]
                - type: regex
                  part: body
                  regex:
                    - '(?i)(_authToken|npmAuthToken|npmRegistryServer|:_auth)\s*[:=]'
          YAML

          cat > "$templates/wrangler-config.yaml" <<'YAML'
          id: navixa-wrangler-config-exposure
          info:
            name: NAVIXA Wrangler Configuration Exposure
            author: navixa-security
            severity: medium
          http:
            - method: GET
              path:
                - "{{BaseURL}}/wrangler.toml"
                - "{{BaseURL}}/wrangler.json"
                - "{{BaseURL}}/wrangler.jsonc"
              matchers-condition: and
              matchers:
                - type: status
                  status: [200]
                - type: regex
                  part: body
                  regex:
                    - '(?i)(compatibility_date|compatibilityDate|d1_databases|d1Databases|account_id|accountId)'
          YAML

          cat > "$templates/debug-log.yaml" <<'YAML'
          id: navixa-debug-log-exposure
          info:
            name: NAVIXA Package Manager Debug Log Exposure
            author: navixa-security
            severity: medium
          http:
            - method: GET
              path:
                - "{{BaseURL}}/npm-debug.log"
                - "{{BaseURL}}/yarn-error.log"
                - "{{BaseURL}}/pnpm-debug.log"
              matchers-condition: and
              matchers:
                - type: status
                  status: [200]
                - type: regex
                  part: body
                  regex:
                    - '(?i)(npm ERR!|yarn error|pnpm.*error)'
          YAML

          cat > "$templates/backup-archive.yaml" <<'YAML'
          id: navixa-backup-archive-exposure
          info:
            name: NAVIXA Backup Archive Exposure
            author: navixa-security
            severity: high
          http:
            - method: GET
              path:
                - "{{BaseURL}}/backup.zip"
                - "{{BaseURL}}/site.zip"
                - "{{BaseURL}}/www.zip"
                - "{{BaseURL}}/navixa.zip"
                - "{{BaseURL}}/backup.tar.gz"
              matchers-condition: and
              matchers:
                - type: status
                  status: [200]
                - type: regex
                  part: header
                  regex:
                    - '(?i)content-type:\s*(application/(zip|x-zip-compressed|gzip|x-gzip)|application/octet-stream)'
          YAML

      - name: Nuclei targeted sensitive-exposure scan
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/navixa-security"
          templates="$RUNNER_TEMP/navixa-nuclei"
          out="$work/nuclei.jsonl"
          mkdir -p "$work"

          docker pull projectdiscovery/nuclei:latest
          docker run --rm \
            -v "$templates:/templates:ro" \
            projectdiscovery/nuclei:latest \
            -u https://navixasa.com \
            -silent \
            -jsonl \
            -disable-update-check \
            -t /templates \
            -rate-limit 5 \
            -concurrency 1 \
            -bulk-size 1 \
            -timeout 5 \
            -retries 0 \
            -H 'User-Agent: NAVIXA-Authorized-Security-Scan/1.0' \
            > "$out"

          echo '=== Nuclei NAVIXA-targeted findings ==='
          if [[ -s "$out" ]]; then
            python3 - "$out" <<'PY'
          import json, sys, collections
          rows=[]
          for line in open(sys.argv[1], encoding='utf-8'):
              line=line.strip()
              if not line:
                  continue
              try:
                  rows.append(json.loads(line))
              except json.JSONDecodeError:
                  pass
          counts=collections.Counter((r.get('info') or {}).get('severity','unknown') for r in rows)
          print('findings_total=', len(rows))
          for sev in ('critical','high','medium','low','info','unknown'):
              if counts.get(sev):
                  print(f'{sev}={counts[sev]}')
          for r in rows:
              info=r.get('info') or {}
              print(f"[{info.get('severity','unknown')}] {info.get('name', r.get('template-id','Unnamed finding'))}")
          PY
          else
            echo 'findings_total=0'
          fi

      - name: Safety boundary statement
        shell: bash
        run: |
          cat <<'EOF'
          This workflow performs authorized low-rate GET-only public-surface checks.
          The ZAP result used for this assessment comes from the earlier baseline/passive run on this PR.
          This final Nuclei run uses six NAVIXA-specific passive templates for exposed environment files,
          Git config, package-registry tokens, Wrangler config, package-manager logs, and backup archives.
          No authentication, POST mutation, credential guessing, exploit payloads, or destructive testing is performed.
          EOF
